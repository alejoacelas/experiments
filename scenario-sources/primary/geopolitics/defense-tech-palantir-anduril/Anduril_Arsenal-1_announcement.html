software, unlike hardware, can be built and improved upon incredibly quickly (more on this below)."}],"markDefs":[],"style":"normal"},{"_key":"42b8d77fbf7b","_type":"block","children":[{"_key":"56ed31ac1ff60","_type":"span","marks":[],"text":"Six decades after they were first introduced, the rules for doing business with the Pentagon remain, in the words of former Defense Secretary Donald Rumsfeld, “one of the world’s last bastions of central planning.”¹⁹ The primary aim of these rules — to keep costs in check — was a failure: in 1969, Robert Benson, an analyst in the Office of the Secretary of Defense, testified that “about 90% of major weapon systems that the Defense Department procures end up costing at least twice as much as was originally estimated.”²⁰ The incentives these rules created for defense companies have ossified into these companies’ very ways of being. It is not malice or incompetence that prevents the large defense companies from innovating, or moving quickly, or investing in internal research and development — it is simply a rational response to the incentives with which they are presented."}],"markDefs":[],"style":"normal"},{"_key":"b66f0b41d4c7","_type":"block","children":[{"_key":"99a6bbb5141c0","_type":"span","marks":[],"text":"3 — The Defense Industry Today"}],"markDefs":[],"style":"h1"},{"_key":"35c5ddd93fb9","_type":"block","children":[{"_key":"46a5e16dbc630","_type":"span","marks":[],"text":"One remarkable statistic tells a damning story about the modern defense sector: Since 1963, the defense industry has never suffered a negative ten-year period."}],"markDefs":[],"style":"normal"},{"_key":"52707447612f","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-fb76d1cce0b152a9f8fae592dd51348956314850-2003x1678-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"d545f705be71","_type":"block","children":[{"_key":"451b4b8afdb20","_type":"span","marks":[],"text":"Is this because defense companies have built an unprecedented succession of valuable products? Far from it. On a long enough time horizon, defense companies are simply not punished for failure (and, indeed, the horizon is not all that long). Individual companies may receive a slap on the wrist for particularly egregious missteps, but by and large the government accepts that, frustrating as it may be, slow timelines, minimal innovation, and swelling costs are “the way things are.”"}],"markDefs":[],"style":"normal"},{"_key":"80ecf65ea7a8","_type":"block","children":[{"_key":"69e193413b240","_type":"span","marks":[],"text":"Part of the reason that the large defense companies keep getting away with underperformance is that they face little competition. In 1993, the Cold War fading into memory, then Deputy Secretary of Defense Bill Perry sat down with the CEOs of the major defense firms at what came to be known as “the last supper.”²² Perry warned them that substantial cuts to the defense budget were coming and that many of their companies would not be able to survive. Put simply, he said, “We expect defense companies to go out of business. We will stand by and watch it happen.” This precipitated a flurry of mergers and acquisitions."}],"markDefs":[],"style":"normal"},{"_key":"d2f44d9dadba","_type":"block","children":[{"_key":"7fee156ebeeb0","_type":"span","marks":[],"text":"Perry attempted to counterbalance the impact of consolidation by lowering the barriers to entry into the defense industry. He discouraged the use of onerous military specifications (“milspecs”) for new systems except as a “last resort”²⁴ and championed 1994’s Federal Acquisitions Streamlining Act (FASA), which mandated the use of commercial, off-the-shelf alternatives over bespoke new technology. He also encouraged program managers in the DoD to “take more risks” and bet on new technology and new companies. Many of these changes, however, were not enforced. Both SpaceX and Palantir were forced to sue their largest customers for a failure to adhere to Perry’s rules,²⁵ ²⁶ while a RAND corporation study from the early 2000s found that program managers had neither the incentives nor capacity to make meaningful bets on new companies and technology.²⁷"}],"markDefs":[],"style":"normal"},{"_key":"51f470d2898b","_type":"block","children":[{"_key":"d8eb23728eab0","_type":"span","marks":[],"text":"The result is an ageing, top-heavy industry that moves slowly because nobody is chasing it. The ten largest defense companies, all of which were founded decades ago, account for upwards of 80% of the industry’s revenue. Nearly two thirds of major weapons systems contracts in the United States have just "},{"_key":"d8eb23728eab1","_type":"span","marks":["em"],"text":"one"},{"_key":"d8eb23728eab2","_type":"span","marks":[],"text":" bidder.²⁸ Shareholders buy defense stocks for their stability, their predictability. These companies move slowly and break as little as possible."}],"markDefs":[],"style":"normal"},{"_key":"e37e0a969a5e","_type":"block","children":[{"_key":"0b956adbd8e10","_type":"span","marks":[],"text":"Most engineers, understandably, do not wish to work on national security under these conditions. Engineers want to see their code deployed, their robots in motion, their products out in the world making an impact. Working slowly on antiquated technology that may never be deployed is far from an engineer’s dream. And so the companies once staffed with some of the greatest engineering minds in the Western world now struggle to attract graduates from top engineering programs."}],"markDefs":[],"style":"normal"},{"_key":"f91a2caa0446","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-ec5eda79ed9580b297802bfdfdd6b191dead5826-2003x2597-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"c78291a122a4","_type":"block","children":[{"_key":"5d7c7aa109f80","_type":"span","marks":[],"text":"The Department of Defense used to own all the technology it needed to credibly deter and, if necessary, win the next great war. But the same is not true today."}],"markDefs":[],"style":"normal"},{"_key":"c1d6a3f19528","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-dd250275ee2790580c68f7ea14b47c3ae20a0059-2480x1676-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"024a127b6b66","_type":"block","children":[{"_key":"d7e889d03d670","_type":"span","marks":[],"text":"This isn’t because our ships aren’t big enough, or our planes fast enough, or our tanks sturdy enough. The areas in which the United States and its allies are falling behind are not these large hardware systems, which we employed to dominate the 20th century, but sophisticated software. The majority of the Department of Defense’s innovation priorities — including artificial intelligence, networked weapons, cybersecurity, and more — are enabled, either in part or in total, by software. The hardware components of swarming munitions, autonomous UAVs, or cruise missile defense systems are just one half of the equation."}],"markDefs":[],"style":"normal"},{"_key":"1ed2f4ba4c2d","_type":"block","children":[{"_key":"d35a07be1dad0","_type":"span","marks":[],"text":"Software will change how war is waged. The battlefield of the future will teem with artificially intelligent, unmanned systems, which fight, gather reconnaissance data, and communicate at breathtaking speeds. The bipartisan congressional Future of Defense Task Force, drawing upon DARPA’s “Mosaic Warfare” concept, describe a future “where ubiquitous and affordable unmanned air and ground platforms find targets on a contested battlefield and pass the information to a decision maker who can instantly task another part of the same system to strike the enemy from safety.”²⁹ The traditional division between land, air, sea, and space domains will become increasingly anachronistic, as nation states compete for total, all-domain superiority."}],"markDefs":[],"style":"normal"},{"_key":"ade11c302aaa","_type":"block","children":[{"_key":"1dbc2a902a700","_type":"span","marks":[],"text":"There is sometimes a misconception among government officials that software is easier to build than hardware, or that higher quality human capital is required to produce hardware than software. This is flatly untrue: Building the software that makes these concepts possible is an engineering task on the order of magnitude of building a fighter jet. It will require the work of the very brightest engineers in the allied democracies."}],"markDefs":[],"style":"normal"},{"_key":"6d738ba07e5a","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-b04f73e5cd122c61f46c4cfc03853cc18afcac67-2608x1952-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"d95c70c4479b","_type":"block","children":[{"_key":"5cd172fbf9d30","_type":"span","marks":[],"text":"Silicon Valley has a near-monopsony on this talent. Almost every single top-tier software engineer in the democratic world works at a technology company, whether at a startup or in Big Tech. John von Neumann, whose talents were so highly valued that the RAND corporation paid him to scribble down his morning thoughts while shaving,³⁰ would today be working for Google or Facebook. Everything about how such companies operate has been tailored to these engineers — the creative and professional freedom, the speed and lack of bureaucracy, even the casual dress code. There is also an economic incentive for these engineers to work at technology companies, which have higher margins than most other industries and can afford to pay their top talent more."}],"markDefs":[],"style":"normal"},{"_key":"f22977aac6e7","_type":"block","children":[{"_key":"732e6f36284f0","_type":"span","marks":[],"text":"The most unrealistic part about James Bond’s gadgets isn’t the technology itself — it’s that the government owns it. Indeed, the companies building transformative software technology rarely work on national security at all. Sometimes, this is for cultural reasons — after employees at Google protested Google’s participation in Project Maven, the DoD’s flagship AI program, Google canceled their contract. Google isn’t alone; the largest tech companies either avoid defense work or treat it as a secondary priority. Moreover, the defense technology they do build is rarely designed for the job. More often, it is commercial software adapted to a military purpose. These companies deserve our applause for working with the government, but dual-use technology won’t be enough to maintain our technological lead."}],"markDefs":[],"style":"normal"},{"_key":"a54c08d0dad9","_type":"block","children":[{"_key":"4ea4a142382e0","_type":"span","marks":[],"text":"In fairness to the tech employees who’d rather not work on national security, they didn’t sign up to work on defense, and there is no reason in a liberal democracy that one should be forced to work on things that one finds objectionable. But it is striking how far behind the times Silicon Valley has been on questions of national security. The tech industry prides itself on being the first to spot new trends. On national security and the rise of our strategic adversaries, it was the last."}],"markDefs":[],"style":"normal"},{"_key":"6c40e6991443","_type":"block","children":[{"_key":"7a2cd21a18670","_type":"span","marks":[],"text":"The traditional defense contractors, meanwhile, struggle with software not only because they lose engineering talent to Silicon Valley, but because modern software development practices conflict with their very ways of being. The legacy primes are used to slowly developing large, exquisite hardware systems like battleships, which sit in a factory for years before they are finally complete. Once sold, they are largely finished, besides occasional maintenance. Software is fundamentally different. It is developed by shipping a minimum viable product out the door as quickly as possible and seeing where it fails. Software companies respond rapidly and continuously to the performance of software in the field, to such an extent that deployment and iteration are parts of the development process itself. As software technology advances, developers add new features and keep a product up to date."}],"markDefs":[],"style":"normal"},{"_key":"d16f09e0d5b1","_type":"block","children":[{"_key":"5cd994b099c00","_type":"span","marks":[],"text":"That is what the military systems and military companies of today should look like: more Tesla than Ford, more Apple than Nokia."}],"markDefs":[],"style":"normal"},{"_key":"01ef8a200d62","_type":"block","children":[{"_key":"03f68d683d1b0","_type":"span","marks":[],"text":"5 — A New Model"}],"markDefs":[],"style":"h1"},{"_key":"33294b280fb5","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-c31da07cb0e2688373338a52d9ff3ebc88d1907f-1990x1738-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"4c22b51d3949","_type":"block","children":[{"_key":"924d690723530","_type":"span","marks":[],"text":"The biggest lie of the political debate surrounding defense spending is that we are stuck in a dichotomy between doing “more with more” or “less with less.” This is a false choice — technology means doing more with less. The stagnation in the defense industry is not inevitable, and we need not accept it."}],"markDefs":[],"style":"normal"},{"_key":"be1a9c23c1bc","_type":"block","children":[{"_key":"bb0ea11414850","_type":"span","marks":[],"text":"Anduril is one of a slew of innovative defense companies pioneering a new model, based on the following principles:"}],"markDefs":[],"style":"normal"},{"_key":"6eefc8a0c758","_type":"block","children":[{"_key":"cc7fb8c162450","_type":"span","marks":["strong"],"text":"1. Outpacing the Threat"}],"markDefs":[],"style":"normal"},{"_key":"faf81e8ca705","_type":"block","children":[{"_key":"49fe6c0061b70","_type":"span","marks":[],"text":"Security threats are evolving faster than we are. In 2018, Under Secretary for Research and Engineering Mike Griffin noted that, on average, it takes the US six- teen years to deliver an idea to operational capability, compared to under seven years for China.³¹ That kind of advantage compounds incredibly quickly: an adversary that starts out with only a fraction of our capabilities but which advances 2x faster will quickly overpower us. And it isn’t just great powers moving more quickly than we are — in the Middle East, well-financed terrorist organizations and militias iterate monthly on their armed drones.³² In the cyber domain, a greater number of state and nonstate actors alike have become capable of sophisticated attacks."}],"markDefs":[],"style":"normal"},{"_key":"c94e13896233","_type":"block","children":[{"_key":"9da0f1e7493d0","_type":"span","marks":[],"text":"We need defense companies that are "},{"_key":"9da0f1e7493d1","_type":"span","marks":["em"],"text":"fast"},{"_key":"9da0f1e7493d2","_type":"span","marks":[],"text":". That won’t happen simply by wishing it to be so: it will only happen if companies are incentivized to move. Thankfully, there is a readily available model for this: every single other industry on the planet. Whether they are selling cars, phones, furniture, or coffee, most companies do not get paid until they build a finished product. That can and should be the case in the defense industry, too: companies should privately finance their research and development, engineer new products quickly and efficiently, and then sell them “off the shelf” to their government partners. The government, in turn, should appropriately reward companies that take on risk and development costs for the technology they build."}],"markDefs":[],"style":"normal"},{"_key":"3657676e7471","_type":"block","children":[{"_key":"2dfc2b598e0b0","_type":"span","marks":[],"text":"There is recent and compelling precedent for this: SpaceX. Despite working on capital-intensive, highly complex products, SpaceX has poured billions of dollars of private capital into research and development. It was found by NASA’s own analysis to be three times cheaper than NASA itself.³³ If rocket-ships can be built quickly and sold “off the shelf,” then so can many more things in the defense budget."}],"markDefs":[],"style":"normal"},{"_key":"9758c34e7b2f","_type":"block","children":[{"_key":"d670fd27af020","_type":"span","marks":[],"text":"But the threat doesn’t stop changing once we sell a system, so nor should our technology. It beggars belief that our men and women in uniform receive updates on their smart phones whenever technology improves, but must wait years for updates to the technology that might save their lives. Software is a double-edged sword: updates can be distributed to operational theaters across the globe with the click of a button, which means that software-enabled technology can stay up to date nearly indefinitely. Conversely, if software isn’t updated frequently, it quickly becomes obsolete. The government should demand the continuous deployment of the latest and greatest software to the tactical edge."}],"markDefs":[],"style":"normal"},{"_key":"d4d75731f208","_type":"block","children":[{"_key":"529f0407af54","_type":"span","marks":["strong"],"text":"2. Building to the Mission, Not to Spec"}],"markDefs":[],"style":"normal"},{"_key":"f67ad6a548c4","_type":"block","children":[{"_key":"40a055657e410","_type":"span","marks":[],"text":"The defining feature of history’s most successful technology companies is product vision. Jeff Bezos, Steve Jobs, Elon Musk, and other great technology entrepreneurs all had distinct images of the future and how their products would shape it. These visions were independent of — and often directly contradicted by — the opinions of those around them. They worked on things that their customers and competition did not believe were possible or did not yet understand. Had they been building new products off painstaking specifications laid out by their customers, the history of modern technology would look very different."}],"markDefs":[],"style":"normal"},{"_key":"5537767c283d","_type":"block","children":[{"_key":"0f484c1a59270","_type":"span","marks":[],"text":"The next great defense companies will also have a vision of the future: they will build to the mission, not to spec. That means designing products to solve problems from first principles. Defense acquisitions have historically been dominated by an emphasis on exquisite platforms — i.e., the Navy needs a fleet with X ships, or the Air Force needs Y planes — whose capability requirements are laid out in excruciating detail. This process answers the question of what the next battleship should look like, but never the question of whether a new battleship is needed at all."}],"markDefs":[],"style":"normal"},{"_key":"97978b4ef4e9","_type":"block","children":[{"_key":"a25536df74e80","_type":"span","marks":[],"text":"Today’s model has things backwards. The problems we are trying to solve should be top of mind, not only for the government, but for the companies building the solutions to those problems. Nobody understands the operational threats that the government is engaging with better than the government itself, but, in turn, nobody understands the technical solutions that can be brought to bear better than industry. Not every company’s product vision will ultimately meet the operational needs of their partners in government, but that is okay — most companies in a capitalist system fail. Competition will bring the best to the forefront and solve problems in ways the government had not predicted or thought possible."}],"markDefs":[],"style":"normal"},{"_key":"0b8cefdc71a7","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-3921dcfc810fb525c4baf542bb96d5c105a5bc89-1148x1762-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"31936a1bebb2","_type":"block","children":[{"_key":"94d5d86b38210","_type":"span","marks":["strong"],"text":"3. Software-First"}],"markDefs":[],"style":"normal"},{"_key":"1c5c5ed3d9da","_type":"block","children":[{"_key":"e183d1ac2c0b0","_type":"span","marks":[],"text":"Software is finally eating the battlefield, whether the defense industry likes it or not. Whether it is AI-enabled drone swarms, networked weapons systems, real-time situational awareness generated by sensor fusion, or cyberwarfare, software is at the core of the weapon systems of the future. Building world-class software platforms is an engineering challenge akin to building a fighter jet: the next generation of defense companies will invest in doing so accordingly."}],"markDefs":[],"style":"normal"},{"_key":"175bd7229fd8","_type":"block","children":[{"_key":"4ff3bdfb508c0","_type":"span","marks":[],"text":"Pure software can radically expand the capabilities of an armed force, but it can become even more potent when integrated into hardware systems. Take unmanned aerial systems, for example. UAVs like General Atomics’ Reapers and Predators have been staples of the United States’ and United Kingdom’s arsenals for decades now, but because these vehicles are manually piloted and monitored, they require a crew of a dozen to operate. Cutting-edge artificial intelligence and autonomy can reverse that equation."}],"markDefs":[],"style":"normal"},{"_key":"499616a9a217","_type":"block","children":[{"_key":"87cf91ce81b30","_type":"span","marks":[],"text":"This is but one example. The broader point is that modern technology companies do not think of the sheet metal on the exterior of a system as its most valuable element: they instead build the hardware around the new capabilities that software enables. For almost any major commercial technology from the last de- cade — new phones, cars, voice assistants, hobby drones — everything from sensor selection to control surfaces is optimized for software."}],"markDefs":[],"style":"normal"},{"_key":"2c58e74f12c4","_type":"block","children":[{"_key":"2e9e0e97d95d0","_type":"span","marks":["strong"],"text":"4. Controlling Defense Budgets"}],"markDefs":[],"style":"normal"},{"_key":"cf9ba27b9054","_type":"block","children":[{"_key":"5cdea5dfaa980","_type":"span","marks":[],"text":"The defense of the nation is the pre-condition for the nation’s prosperity — but defense companies have a duty, like any entity that receives public funding, to deliver services to the government at a minimal burden to the taxpayer."}],"markDefs":[],"style":"normal"},{"_key":"485fb832cd91","_type":"block","children":[{"_key":"bdbf4d5f08dc0","_type":"span","marks":[],"text":"This is a particularly sensitive issue for the defense industry. Governments around the world routinely (and justifiably) complain of being bilked³⁴ by major defense contractors.³⁵ While there are certainly historical examples of fraud and abuse on the part of contractors, the deeper problem is structural. High costs are endemic to a defense industry that operates off cost-plus contracts."}],"markDefs":[],"style":"normal"},{"_key":"12029d422e37","_type":"block","children":[{"_key":"648a355ec4ac0","_type":"span","marks":[],"text":"On the other hand, the uncomfortable truth is that it is impossible to build and scale a successful business without rewarding the investors and employees who took a risk on it. If the companies challenging the incumbent defense firms are not profitable, they will get nowhere at all, and our defense technology will continue to languish behind consumer tech."}],"markDefs":[],"style":"normal"},{"_key":"86cf0b78104d","_type":"block","children":[{"_key":"600453f4f95f0","_type":"span","marks":[],"text":"There is no magic bullet for driving down costs, but a healthy dose of free market capitalism would go a long way in getting us there. The more companies we bring into the defense industrial base, the more these companies will have to compete on price. The more that companies spend on their own dime rather than relying on cost-plus contracts, the more they’ll cut costs. And the more we leverage new technology like AI, the more we can save on labor costs for the dull, dirty, dangerous jobs of military service."}],"markDefs":[],"style":"normal"},{"_key":"04eda459e284","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-b3ec9929e077e2af131ff1ebdb218a49b701dee7-720x720-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"a0a7b9395e7e","_type":"block","children":[{"_key":"9ddfe3be230d0","_type":"span","marks":[],"text":"6 — The Government Response"}],"markDefs":[],"style":"h1"},{"_key":"2d5a6ea19ba2","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-f6f4e23b08208ce5264de27632f48f1cc224e0aa-1920x1280-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"7dec6072d454","_type":"block","children":[{"_key":"a08bfce2a6ca0","_type":"span","marks":[],"text":"With the principles above, we can create a new breed of modern, agile defense companies that turn our soldiers into superheroes. These companies will solve problems of their own accord, but also bring out the best in the incumbent defense contractors, who have not felt competition nipping at their heels in decades."}],"markDefs":[],"style":"normal"},{"_key":"e9ff0e993628","_type":"block","children":[{"_key":"6ee4c04fb5670","_type":"span","marks":[],"text":"But the companies following these principles, however well-intentioned, will mostly fail without an equivalent response from our government leaders. The major defense companies operate as they do because our laws and regulations incentivize it. Governments across the democratic world have a monumental task ahead of them in reshaping the incentives of the defense industry and allowing a more dynamic, innovative model to thrive."}],"markDefs":[],"style":"normal"},{"_key":"c72808f16d13","_type":"block","children":[{"_key":"21226dc6b80d0","_type":"span","marks":[],"text":"We have spent the last few years publishing and advocating a series of policy analyses and recommendations to modernize our antiquated weapons acquisitions system, usually tailored to the United States government but often applicable across nations. Recommendations like these are just the tip of the iceberg, and we exhort our leaders in government to develop and drive forward solutions where they see problems. A few areas we have identified where we can make major progress include:"}],"markDefs":[],"style":"normal"},{"_key":"e4f2b3df8d37","_type":"block","children":[{"_key":"602f1b4d1fc90","_type":"span","marks":["43ac6089cff7","strong"],"text":"1. Thinking Software-First"}],"markDefs":[{"_key":"43ac6089cff7","_type":"link","href":"https://blog.anduril.com/in-the-21st-century-the-department-of-defense-must-think-software-first-36802bd4be65"}],"style":"normal"},{"_key":"9213d2fbdfc7","_type":"block","children":[{"_key":"5dfa7ebecbde0","_type":"span","marks":[],"text":"This isn’t just for companies: the government must embrace a software-first mindset too. In practice, this would involve a long series of changes, including but not limited to:"}],"markDefs":[],"style":"normal"},{"_key":"5cf8a0bc27f2","_type":"block","children":[{"_key":"84ea70d3c86a0","_type":"span","marks":["em"],"text":"a. Establishing large, critical programs for key software priorities."}],"markDefs":[],"style":"normal"},{"_key":"ea552b8e4853","_type":"block","children":[{"_key":"05ebd8dc0d280","_type":"span","marks":[],"text":"Simply put, the government does not value software in the way that it does hardware. In the United States, fewer than 10% of the military’s Major Defense Acquisition Programs (MDAPs) are software systems. Even more damningly, the military’s largest software programs are mostly IT tools, designed for internal management and civil functions, most of which could be done better by commercially available technology. The first step toward leveraging the latest in modern technology is "},{"_key":"05ebd8dc0d281","_type":"span","marks":["em"],"text":"demanding"},{"_key":"05ebd8dc0d282","_type":"span","marks":[],"text":" it through big programs."}],"markDefs":[],"style":"normal"},{"_key":"3760fb0e857c","_type":"block","children":[{"_key":"bbed0d80a4030","_type":"span","marks":["em"],"text":"b. Awarding prime contracts to software companies."}],"markDefs":[],"style":"normal"},{"_key":"1da47a9c60c0","_type":"block","children":[{"_key":"3a0a45eaf0fe0","_type":"span","marks":[],"text":"Fundamental design decisions for new military systems are typically made before software companies are even consulted, meaning the hardware is not optimized for and often entirely unable to accommodate cutting-edge software."}],"markDefs":[],"style":"normal"},{"_key":"685f5286d05f","_type":"block","children":[{"_key":"a32255e405330","_type":"span","marks":["em"],"text":"c. Aligning acquisition policy with industry best practices."}],"markDefs":[],"style":"normal"},{"_key":"0a2462f5cc53","_type":"block","children":[{"_key":"15f5ff7404770","_type":"span","marks":[],"text":"This would include transitioning away from RDT&E- heavy, cost-plus fixed fee contracts towards firm fixed price contracts that encourage rapid prototyping, deployment, and testing of new capabilities. To go even further, governments should experiment with industry-standard payment structures like subscriptions and “as-a-service” models, which minimize switching and sunk costs, encourage competition, and demand that technology is constantly updated."}],"markDefs":[],"style":"normal"},{"_key":"221aa4ba776d","_type":"block","children":[{"_key":"a17e42ce9b0d0","_type":"span","marks":["6a5b1ca54afb","strong"],"text":"2. Running Meritocratic Competitions for New Systems"}],"markDefs":[{"_key":"6a5b1ca54afb","_type":"link","href":"https://blog.anduril.com/reward-winners-or-america-loses-2f4091f251e8"}],"style":"normal"},{"_key":"4c50679d73bb","_type":"block","children":[{"_key":"923c5e9873330","_type":"span","marks":[],"text":"Most government contracts are awarded on the basis of lengthy proposals, with little to no reference to real-life performance of the technology in question. To encourage the most innovative companies and engineers to work on defense technology, the government should instead:"}],"markDefs":[],"style":"normal"},{"_key":"ef7c585606eb","_type":"block","children":[{"_key":"38e3b551f4b80","_type":"span","marks":["em"],"text":"a. Shift from proposals-focused competition to performance-based competition."}],"markDefs":[],"style":"normal"},{"_key":"46022cd0fe82","_type":"block","children":[{"_key":"35b6a6eb8d6f0","_type":"span","marks":[],"text":"Instead of prioritizing proposals, acquisitions should be structured as a series of bake-offs and well delineated projects that test a vendor’s ability to solve a problem with technology and deploy it operationally."}],"markDefs":[],"style":"normal"},{"_key":"7647835f7728","_type":"block","children":[{"_key":"47337e66d3020","_type":"span","marks":["em"],"text":"b. Always have a meaningful contract at the end of a competition, and issue it quickly."}],"markDefs":[],"style":"normal"},{"_key":"cf44796b6241","_type":"block","children":[{"_key":"6205f7df937c0","_type":"span","marks":[],"text":"Innovation grants and pilot contracts only go so far — in return for investing time and money into demonstrating a new capability, companies that successfully solve government problems should be rewarded in a timely manner."}],"markDefs":[],"style":"normal"},{"_key":"8d347c64af60","_type":"block","children":[{"_key":"5435c98fee390","_type":"span","marks":["em"],"text":"c. Keep rewarding new winners by frequently recompeting large programs."}],"markDefs":[],"style":"normal"},{"_key":"8806c6f91e5c","_type":"block","children":[{"_key":"e472d95b8d3e0","_type":"span","marks":[],"text":"Governments routinely award decade-long, multibillion dollar contracts to single vendors. This couldn’t be more different to the commercial world, where consumers are typically free to switch between vendors at minimal cost."}],"markDefs":[],"style":"normal"},{"_key":"c844ac1f495a","_type":"block","children":[{"_key":"3e2149bbe1100","_type":"span","marks":["em"],"text":"d. Measure outputs, not inputs."}],"markDefs":[],"style":"normal"},{"_key":"40f380e7e9fc","_type":"block","children":[{"_key":"6e1cc0ccb2cf0","_type":"span","marks":[],"text":"Governments should hold themselves accountable: instead of asking how many competitions they held, they should ask themselves how many of those competitions led to a meaningful contract for a nontraditional defense company."}],"markDefs":[],"style":"normal"},{"_key":"f0355627a24f","_type":"block","children":[{"_key":"05ed42771d900","_type":"span","marks":["adf29214ec01","strong"],"text":"3. Revamping Anachronistic Data Rights Practices"}],"markDefs":[{"_key":"adf29214ec01","_type":"link","href":"https://blog.anduril.com/the-dod-should-pilot-a-new-category-of-software-data-rights-a949cc9aaae4"}],"style":"normal"},{"_key":"b7de0cd7d0ab","_type":"block","children":[{"_key":"660f764990810","_type":"span","marks":[],"text":"The government typically demands “data rights” — or technical information about how to build a given piece of technology — in a sweeping, one-size-fits-all fashion, a relic of a hardware-centric world. This, unfortunately, scares away all but a handful of modern software companies, who view giving the government their valuable source code as an existential threat to the company. A new model of data rights agreements would:"}],"markDefs":[],"style":"normal"},{"_key":"4dc0d5b4c62b","_type":"block","children":[{"_key":"8a680c93a1a50","_type":"span","marks":["em"],"text":"a."},{"_key":"8a680c93a1a51","_type":"span","marks":[],"text":" "},{"_key":"8a680c93a1a52","_type":"span","marks":["em"],"text":"Account for the size of the program in question, allowing vendors to retain greater rights for small programs and giving the government greater control for larger programs."}],"markDefs":[],"style":"normal"},{"_key":"f6c6c769907f","_type":"block","children":[{"_key":"9552595ad4900","_type":"span","marks":["em"],"text":"b. Closely define the scope of the use of the software being acquired."}],"markDefs":[],"style":"normal"},{"_key":"8a89f8c13407","_type":"block","children":[{"_key":"d7d893270a210","_type":"span","marks":["em"],"text":"c."},{"_key":"d7d893270a211","_type":"span","marks":[],"text":" "},{"_key":"d7d893270a212","_type":"span","marks":["em"],"text":"Address technical lock-in by demanding adherence to technical interoperability standards such as APIs and Government-defined or industry-defined open protocols."}],"markDefs":[],"style":"normal"},{"_key":"eb94b2690490","_type":"block","children":[{"_key":"6b46183f22020","_type":"span","marks":["em"],"text":"d."},{"_key":"6b46183f22021","_type":"span","marks":[],"text":" "},{"_key":"6b46183f22022","_type":"span","marks":["em"],"text":"Allow vendors to propose alternative contract structures, including as-a-service contracts."}],"markDefs":[],"style":"normal"},{"_key":"d9109198c3e6","_type":"block","children":[{"_key":"5e77614fa48d0","_type":"span","marks":["em"],"text":"e. Weigh the costs, not just the benefits, of demanding greater data rights."}],"markDefs":[],"style":"normal"},{"_key":"8a0149a88ec6","_type":"block","children":[{"_key":"d1a53c2b97170","_type":"span","marks":["c23e46d20010","strong"],"text":"4. Helping Companies Cross the ‘Valley of Death’ by Loosening Contracting Timelines"}],"markDefs":[{"_key":"c23e46d20010","_type":"link","href":"https://blog.anduril.com/dod-valley-of-death-closing-the-two-year-gap-758907be9b9f"}],"style":"normal"},{"_key":"d59f8dc5b0c7","_type":"block","children":[{"_key":"18eaa2c33e360","_type":"span","marks":[],"text":"In the United States, it is easier than ever to win a small pilot or prototype contract from the government thanks to a smorgasbord of new innovation entities like the Defense Innovation Unit, AFWERX, NavalX, and more. Conversely, it has never been harder to transition to a large program of record, leaving companies languishing for years between initial funding and scaled deployments. This often sends companies bankrupt, or, more typically, dissuades companies from ever doing business with the government in the first place. This year, the United States Congress addressed this problem with an “Agile Procurement Transition Pilot,” designed to help scale new technologies quickly and get companies through the valley of death. This is a valuable start, but by no means a wholesale solution to the valley of death. Governments across the democratic world should find ways to speed up their acquisitions processes and quickly get new technology into the hands of their uniformed men and women."}],"markDefs":[],"style":"normal"},{"_key":"02ad47a3de3b","_type":"block","children":[{"_key":"18cea671e6ab0","_type":"span","marks":["0a5172898061","strong"],"text":"5. Leveraging Existing Programs"}],"markDefs":[{"_key":"0a5172898061","_type":"link","href":"https://blog.anduril.com/how-the-government-can-use-the-sbir-program-to-scale-innovation-e53806941af2"}],"style":"normal"},{"_key":"fbfb23982c1b","_type":"block","children":[{"_key":"6ea5867e937c0","_type":"span","marks":[],"text":"Often, the government has created programs to access and scale new innovations. Because the process to acquire new technologies is so Byzantine, however, acquisitions officers are often unaware of or under-educated about the acquisition tools at their disposal. Where possible, governments should publicize and educate acquisition and contract officers about the tools they already possess to minimize bureaucracy and access new technology."}],"markDefs":[],"style":"normal"},{"_key":"53f403e6b585","_type":"block","children":[{"_key":"36970974fa420","_type":"span","marks":[],"text":"Since founding Anduril, we have been profoundly encouraged by the volume and intensity of support ideas like these have received from those in government. There is a growing group of government officials in administrations across the world who recognize that business as usual simply will not cut it anymore. The challenge ahead is gigantic, but so are the rewards of success: continued peace and prosperity in the democratic world."}],"markDefs":[],"style":"normal"},{"_key":"c62ba555db47","_type":"block","children":[{"_key":"80c5f171dae40","_type":"span","marks":[],"text":"7 — Call to Action"}],"markDefs":[],"style":"h1"},{"_key":"f213d4891faf","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-17d22fe9d19312bcd960675af5e64df3274c508f-2936x1952-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"f00b9ebcca6d","_type":"block","children":[{"_key":"f5db7c75c00b0","_type":"span","marks":["strong"],"text":"There is no secret government silo of advanced technology that will save us if war breaks out —"},{"_key":"f5db7c75c00b1","_type":"span","marks":[],"text":" "},{"_key":"f5db7c75c00b2","_type":"span","marks":["strong","em"],"text":"you must build it."},{"_key":"f5db7c75c00b3","_type":"span","marks":[],"text":" "},{"_key":"f5db7c75c00b4","_type":"span","marks":["strong"],"text":"If you have read this far, you care deeply about the future of our collective defense. As engineers, government leaders, and citizens:"}],"markDefs":[],"style":"normal"},{"_key":"ec948017c995","_type":"block","children":[{"_key":"56600527fa340","_type":"span","marks":["strong"],"text":"Help us to rebuild the arsenal of democracy and make that future safe, prosperous, and free."}],"markDefs":[],"style":"normal"},{"_key":"1f2c5fd3902a","_type":"block","children":[{"_key":"dc1e6929b6b10","_type":"span","marks":[],"text":"References"}],"markDefs":[],"style":"h2"},{"_key":"c7f89dc03899","_type":"block","children":[{"_key":"b909f76953700","_type":"span","marks":[],"text":"¹ Brose, Christian. "},{"_key":"b909f76953701","_type":"span","marks":["em"],"text":"The Kill Chain"},{"_key":"b909f76953702","_type":"span","marks":[],"text":". 2020. p. xii."}],"markDefs":[],"s
