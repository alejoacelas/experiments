29:42Z","_id":"6544fb83-2b9e-404d-bd1e-e64e16dc6ec4","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","date":"2024-08-07","image":{"_type":"imageWithMeta","alt":"Anduril's futuristic manufacturing facility with solar panels and parking lot.","asset":{"_id":"image-3cd04656a74b34a10385d15f586f3e13027cd14b-1800x942-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.910828025477707,"height":942,"width":1800},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","description":"Anduril secures $1.5B Series F funding to hyperscale defense manufacturing and open Arsenal-1, a 5M+ sq ft facility for autonomous weapons systems production.","title":"Anduril Raises $1.5 Billion to Rebuild the Arsenal of Democracy","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"N1G5rtOZj8187JlhVNj8ZV","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"U0oN0QIqDw3OWy2Rvws2n8"}},"_type":"page","_updatedAt":"2026-10-06T20:13:24Z","category":"company","meta":{"description":"The latest news, announcements, and insights from Anduril Industries.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"deba6017-6ea9-492e-a4f6-78f295f14d6a","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"slices":[{"_key":"1a0eb2294315","_type":"oneColumnRichText","content":[{"_key":"549eed8705cd","_type":"block","children":[{"_key":"fb15ce960a730","_type":"span","marks":["em"],"text":"Anduril to open Arsenal-1, a 5M+ square foot manufacturing facility designed to hyperscale defense manufacturing"},{"_key":"fb15ce960a731","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"lead"},{"_key":"dade900e14b1","_type":"block","children":[{"_key":"e08e13d599d0","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a732","_type":"span","marks":["strong"],"text":"Costa Mesa, CA"},{"_key":"fb15ce960a733","_type":"span","marks":[],"text":" — Today, Anduril Industries announced it has secured $1.5 billion of funding for its Series F round to hyperscale defense manufacturing. This funding will enable Anduril to increase hiring, enhance processes, upgrade tooling, increase resiliency in its supply chain and expand infrastructure. Anduril is also investing in Arsenal, the manufacturing platform for modern warfare. With Arsenal, Anduril’s goal is to manufacture and produce tens of thousands of autonomous weapons systems addressing the urgent needs of the United States and our allies."}],"markDefs":[]},{"_key":"f9f606071d56","_type":"block","children":[{"_key":"13d7352c07ea","_type":"span","marks":[],"text":"Co-led by Founders Fund and Sands Capital, Anduril’s Series F values the company at $14 billion and includes new investors Fidelity Management & Research Company, Counterpoint Global, and Baillie Gifford, as well as major commitments from existing investors including Altimeter and Franklin Venture Partners."}],"markDefs":[]},{"_key":"a17479d2e236","_type":"block","children":[{"_key":"45b228134670","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a734","_type":"span","marks":["strong"],"text":"A New Paradigm in Defense Production"},{"_key":"fb15ce960a735","_type":"span","marks":[],"text":"\nAs the United States and our allies attempt to gain affordable mass with autonomous systems, weapons, and munitions, the defense industrial base must be capable of producing orders of magnitude more than it is currently producing today. To support that effort, Anduril is investing our own dollars to hyperscale weapons manufacturing using the same agile, rapid, and scalable processes found in the commercial manufacturing sector."}],"markDefs":[]},{"_key":"f633a6762f1a","_type":"block","children":[{"_key":"36200726af83","_type":"span","marks":[],"text":"The conflict in Ukraine has exposed a critical vulnerability in the United States’ ability to respond to crisis. In a major conflict, use of weapons and munitions would quickly exceed supply — it is projected that the United States would run out of weapons in the first few weeks. At the same time, the traditional defense industrial base has faced significant challenges in scaling production to meet demands. Slow and low production rates, inflexible processes and the development of exquisite, defense-specific, bespoke systems have hindered the ability to respond quickly to need. Lead times to replenish key weapons and munitions average two years."}],"markDefs":[]},{"_key":"3014b158bae0","_type":"block","children":[{"_key":"6a7930d269d4","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a736","_type":"span","marks":["strong"],"text":"Introducing Arsenal: The Manufacturing Platform for Modern Warfare"},{"_key":"fb15ce960a737","_type":"span","marks":[],"text":"\nArsenal is a software-defined manufacturing platform that is optimized for the mass production of autonomous systems and weapons. To achieve hyperscale, the arsenal platform leverages four principles: design for simplicity and scale, resilient supply chain, software-defined production, and central infrastructure - a factory called Arsenal-1."}],"markDefs":[]},{"_key":"7919ae20568d","_type":"block","children":[{"_key":"e306cad6f442","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a738","_type":"span","marks":["em"],"text":"Design for simplicity and scale:"},{"_key":"fb15ce960a739","_type":"span","marks":[],"text":"\nArsenal dismantles the traditional defense production preference for complexity by designing products that are as simple as possible, eliminating unnecessary materials, parts, and specialized processes. In addition, the Arsenal design leverages a nonlinear approach to production, driven by modular and flexible design decisions."}],"markDefs":[]},{"_key":"adc3557bf097","_type":"block","children":[{"_key":"a0d5b6d93e5c","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a7310","_type":"span","marks":["em"],"text":"Resilient supply chain"},{"_key":"fb15ce960a7311","_type":"span","marks":[],"text":":\nArsenal integrates a commercial supply chain wherever possible, a strategy that brings efficiency and agility to defense production. Nearly 90 percent of Anduril’s products can be developed and manufactured at hyperscale using commercially available components and materials. Access to this diverse and reliable pool of components reduces lead times and production costs."}],"markDefs":[]},{"_key":"d71a5c8c3821","_type":"block","children":[{"_key":"33f8761a2dc2","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a7312","_type":"span","marks":["em"],"text":"Software-defined production"},{"_key":"fb15ce960a7313","_type":"span","marks":[],"text":":\nThe Arsenal platform is software-defined, and the software serves as a unified system to integrate the design, development, and mass production stages for all Anduril products. Arsenal consists of a common enterprise resource planning system and a proprietary manufacturing execution software system to integrate threat-based operational analysis, modeling, simulation, drawing, testing, bill of materials management, work orders, production, and data management across the product lifecycle."}],"markDefs":[]},{"_key":"c6a5f0471c30","_type":"block","children":[{"_key":"170a4b363ce0","_type":"span","marks":[],"text":""},{"_key":"fb15ce960a7314","_type":"span","marks":["em"],"text":"Central facility in Arsenal-1:"},{"_key":"fb15ce960a7315","_type":"span","marks":[],"text":"\nTo join the existing family of factories, Anduril is investing hundreds of millions in the development of Arsenal-1. Upon completion, Arsenal-1 will be more than five million square feet of production space that will employ thousands of people and is designed to produce tens of thousands of autonomous military systems annually."}],"markDefs":[]},{"_key":"2f2065bc1e44","_type":"block","children":[{"_key":"78f4a746fad5","_type":"span","marks":[],"text":"Arsenal-1 provides maximum flexibility to reallocate the most critical manufacturing resources — people, capital, machines, and materials — to meet new requirements, launch new products, or scale production to meet surges in demand, indefinitely. This is simply not possible when those critical resources are spread out across multiple, distributed geographic areas."}],"markDefs":[]},{"_key":"063d0f344307","_type":"block","children":[{"_key":"0bc751d94d31","_type":"span","marks":[],"text":"Anduril’s commitment to agile, responsive manufacturing has already been demonstrated globally. Most recently, Anduril announced a $75 million investment to increase manufacturing and production capacity for solid rocket motors in "},{"_key":"fb15ce960a7316","_type":"span","marks":["ebc2c8a4a584"],"text":"Mississippi"},{"_key":"fb15ce960a7317","_type":"span","marks":[],"text":". In addition, Anduril also announced the opening of its "},{"_key":"fb15ce960a7318","_type":"span","marks":["8dada7c7d8dd"],"text":"Rhode Island production facility"},{"_key":"fb15ce960a7319","_type":"span","marks":[],"text":" to enable Anduril to increase production to 200 AUVs per year. This complements our existing network of current factories in California and Georgia as well as our Ghost Shark factory in Australia."}],"markDefs":[{"_key":"ebc2c8a4a584","_type":"internalLink","reference":{"_id":"5c9cd11a-e666-45bd-9a59-fbd1144b72b7","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"anduril-expands-solid-rocket-motor-production-facility"},"title":"Anduril Expands Solid Rocket Motor Production Facility"},"targetBlank":false},{"_key":"8dada7c7d8dd","_type":"internalLink","reference":{"_id":"d3e495ba-63ef-4349-992b-f539b283df0f","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"anduril-to-open-large-scale-production-facility-for-autonomous-underwater-vehicles"},"title":"Anduril to Open Large Scale Production Facility for Autonomous Underwater Vehicles"},"targetBlank":false}]},{"_key":"6519282ca565","_type":"block","children":[{"_key":"bc99157f41ff","_type":"span","marks":[],"text":"Consistent with Anduril’s broader approach, Anduril is taking on the risk of developing Arsenal by using its own dollars to invest in people, process, tooling, supply chain resiliency, and infrastructure. Anduril is committed to transforming US and allied defense capabilities by combining modern software expertise with a rapid and differentiated approach to hardware development and manufacturing. From cutting-edge counter drone systems to extra-large autonomous underwater vehicles, Anduril has proven it can deliver highly-performant, next-generation, software-defined capabilities on a timeline and scale that matters."}],"markDefs":[]},{"_key":"daf182dee15e","_type":"block","children":[{"_key":"a32dc79b9c25","_type":"span","marks":[],"text":"##"}],"markDefs":[]},{"_key":"053111a72c26","_type":"block","children":[{"_key":"c2bcb7ee389f","_type":"span","marks":[],"text":"For more information: www."},{"_key":"fb15ce960a7320","_type":"span","marks":["4e2b56c67bd0"],"text":"Rebuildthearsenal.com"},{"_key":"fb15ce960a7321","_type":"span","marks":[],"text":"\n"}],"markDefs":[{"_key":"ebc2c8a4a584","_type":"internalLink","reference":{"_id":"5c9cd11a-e666-45bd-9a59-fbd1144b72b7","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"anduril-expands-solid-rocket-motor-production-facility"},"title":"Anduril Expands Solid Rocket Motor Production Facility"},"targetBlank":false},{"_key":"8dada7c7d8dd","_type":"internalLink","reference":{"_id":"d3e495ba-63ef-4349-992b-f539b283df0f","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"anduril-to-open-large-scale-production-facility-for-autonomous-underwater-vehicles"},"title":"Anduril to Open Large Scale Production Facility for Autonomous Underwater Vehicles"},"targetBlank":false},{"_key":"4e2b56c67bd0","_type":"link","href":"http://Rebuildingthearsenal.com"}]}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-raises-usd1-5-billion-to-rebuild-the-arsenal-of-democracy"},"title":"Anduril Raises $1.5 Billion to Rebuild the Arsenal of Democracy"},{"_createdAt":"2024-06-10T12:33:42Z","_id":"5c9cd11a-e666-45bd-9a59-fbd1144b72b7","_rev":"ESvEjc6swyeoEqIQr9kAFP","_type":"article","_updatedAt":"2026-04-08T01:28:25Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_rev":"8QtQE8S3U2lXjdjxKMFvCL","_type":"person","_updatedAt":"2025-11-18T00:08:12Z","bio":[],"fullName":"Anduril Industries","image":{"_type":"image","asset":{"_ref":"image-a990fb8ef1bae814dc01807f8757917489c9e64d-2536x2536-jpg","_type":"reference"}},"metadata":null,"slug":{"_type":"slug","current":"anduril-industries"}}],"categories":[{"_createdAt":"2025-04-10T03:57:42Z","_id":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_rev":"eBmLOIrMzK4fuf6o6EXXw6","_type":"articleCategory","_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"date":"2024-06-10","image":{"_type":"imageWithMeta","alt":"Anduril officials and dignitaries hold shovels at groundbreaking ceremony for expanded rocket motor facility.","asset":{"_id":"image-bef691da35e281bfde11c0089ebfb9285704eee9-8082x4240-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.9061320754716982,"height":4240,"width":8082},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","description":"Anduril is investing $75 million to increase manufacturing and production capacity for solid rocket motors, creating more than 60 jobs in Stone County, MS by December 2024.","title":"Anduril Expands Solid Rocket Motor Production Facility","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"N1G5rtOZj8187JlhVNj8ZV","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"U0oN0QIqDw3OWy2Rvws2n8"}},"_type":"page","_updatedAt":"2026-10-06T20:13:24Z","category":"company","meta":{"description":"The latest news, announcements, and insights from Anduril Industries.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"deba6017-6ea9-492e-a4f6-78f295f14d6a","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"relatedArticles":[{"_createdAt":"2023-08-08T17:37:02Z","_id":"87e16269-d9c4-490c-ac19-8fb507ae90c6","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","authors":[{"_key":"5dac03809fe1","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"3a53729f276c","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"},{"_key":"5aae598447ae","_ref":"c72ca404-8ff8-479c-9c0f-0ae73fc0a430","_type":"reference"},{"_key":"df6a5116ecaf","_ref":"f84a91e1-010a-4e53-853b-2c9f005edbda","_type":"reference"}],"date":"2023-06-25","image":{"_type":"imageWithMeta","alt":"Solid rocket motor test firing with bright orange and pink flame thrust.","asset":{"_ref":"image-650cb8d540d6467dfb3fcd742e2ca637837cf686-1600x900-jpg","_type":"reference"}},"meta":{"_type":"meta","description":"Anduril acquires Adranos to become a merchant supplier of solid rocket motors, bringing advanced ALITEC fuel technology and modern manufacturing to the defense industry.","title":"ANDURIL INDUSTRIES ACQUIRES SOLID ROCKET MOTOR MANUFACTURER ADRANOS","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"cba4297cb0b6","_ref":"32719de1-93e9-4884-a9f1-948d06259a8e","_type":"reference"},{"_key":"24d4b72c7232","_ref":"a6a9e3c1-8638-48a4-9a63-885486cd9d36","_type":"reference"},{"_key":"e6c13b60e08b","_ref":"77437e63-70e7-41f1-9a11-a9adfc914449","_type":"reference"}],"slices":[{"_key":"68304f7b8431","_type":"oneColumnRichText","content":[{"_key":"a6e6019accf3","_type":"block","children":[{"_key":"91e21583dd230","_type":"span","marks":[],"text":"Costa Mesa, CA — Anduril Industries, a defense technology company, and Adranos, a manufacturer of solid rocket motors, have announced the completion of Anduril’s acquisition of Adranos. The terms of the deal were not disclosed."}],"markDefs":[],"style":"lead"},{"_key":"0ff3ecd03c7d","_type":"block","children":[{"_key":"153701cb13190","_type":"span","marks":[],"text":"Through this acquisition, Anduril will become a merchant supplier of solid rocket motors to prime contractors delivering missiles, hypersonics and other propulsion systems for some of the Department of Defense’s most important programs. Anduril’s entrance to the market as a supplier will bring more resources and competition to an industry facing heavy consolidation, expand the industrial supply base, and provide increased velocity for development and production of solid rocket motors, which are critical to replenishing allied stockpiles of munitions and maintaining credible deterrence."}],"markDefs":[],"style":"normal"},{"_key":"cc914529e908","_type":"block","children":[{"_key":"4be3e4ce93dc0","_type":"span","marks":[],"text":"Founded in 2015, Adranos has refined an approach to the development of solid rocket motors that meets the evolving challenges of modern warfare. Adranos invented a proprietary aluminum-lithium alloy fuel called ALITEC that can produce up to a 40% range increase in solid rocket motors, while saving costs. The company has also devised an advanced manufacturing process for developing solid rocket motors that is significantly faster and more efficient than techniques used by legacy solid rocket motor manufacturers."}],"markDefs":[],"style":"normal"},{"_key":"4a6f646ae5a0","_type":"block","children":[{"_key":"695bf2b67fde0","_type":"span","marks":[],"text":"Anduril will bring critical resources toward developing the Adranos Solid Rocket Complex production facility in Mississippi into a modern manufacturing facility, which will increase output of both standard and ALITEC solid rocket motors to thousands per year at much faster lead times than currently available."}],"markDefs":[],"style":"normal"},{"_key":"dd30de760acf","_type":"block","children":[{"_key":"ed471393b8ca0","_type":"span","marks":[],"text":"“There is a clear need for greater competition and expanded supply in solid rocket motors for the United States and our allies,” said Anduril CEO Brian Schimpf. “With this acquisition, Anduril will grow the defense industrial base, speed development and production of critical components with an advanced manufacturing approach, and enable next-generation performance of solid rocket motors with ALITEC, which is crucial for national security and overall health of the defense industry.”"}],"markDefs":[],"style":"normal"},{"_key":"873aaf2a93f1","_type":"block","children":[{"_key":"6143c3564d760","_type":"span","marks":[],"text":"“Our focus has been on innovating solid rocket motor development and manufacturing, solving the problems of rocket range and production volumes,” said Adranos CEO Chris Stoker. “With Anduril, we’ll be able to rapidly mature our technology and scale our team and production capabilities to increase our output to thousands of traditional and ALITEC solid rocket motors per year.”"}],"markDefs":[],"style":"normal"},{"_key":"40157f0e893d","_type":"block","children":[{"_key":"abcbe3286a890","_type":"span","marks":[],"text":"“Solid rocket motors power some of the most important resources in our arsenal to protect our national security interests, and to fortify our military advantages over adversaries like China, Russia, and Iran,” said U.S. Senator Cyndi Hyde-Smith (R-Miss). “Mississippi is proud of the contributions our workers make toward these important missions. This announcement brings together world-class talent, innovation, and commitment to national defense from Anduril and Adranos. We are thrilled by the opportunity to manufacture best-in-class solid rocket motors in Mississippi to ensure the men and women who protect us are the best trained and equipped in the world.”"}],"markDefs":[],"style":"normal"},{"_key":"413ba24f5670","_type":"block","children":[{"_key":"7fe018396bf40","_type":"span","marks":[],"text":"“The availability of solid rocket motors is of critical importance to U.S. national security. These motors are the lifeblood of munitions, hypersonic weapons, and small space launch systems,” said U.S. Senator Roger Wicker (R-Miss). “Anduril’s acquisition of Adranos establishes a new merchant supplier of these components at a critical time. Anduril’s plan to expand its presence in Mississippi will create more jobs and add to our state’s strong ecosystem of space and defense companies.”"}],"markDefs":[],"style":"normal"},{"_key":"cfb21df48df1","_type":"block","children":[{"_key":"7491a22286880","_type":"span","marks":[],"text":"“Congratulations to Anduril Industries and Adranos on this exciting deal,” said Mississippi Governor Tate Reeves. “Mississippi’s economy is growing stronger every day and companies are really taking off in our state. We have the best workforce in the nation and the innovation happening here is truly awe-inspiring. Mississippians are manufacturing the most advanced solid rocket motors in the world. If you’re a company in the defense industry, Mississippi is the ideal place to do business.”"}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-industries-acquires-solid-rocket-motor-manufacturer-adranos"},"title":"ANDURIL INDUSTRIES ACQUIRES SOLID ROCKET MOTOR MANUFACTURER ADRANOS"},{"_createdAt":"2023-12-21T21:27:09Z","_id":"c326b774-5e0a-4acc-8384-c90ee8d8ad09","_rev":"ESvEjc6swyeoEqIQr9k7NW","_type":"article","_updatedAt":"2026-04-08T01:28:18Z","authors":[{"_key":"c2d6dff6dabb","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"e381c918b680","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"}],"date":"2023-12-22","image":{"_type":"imageWithMeta","alt":"Anduril Industries 2023 year in review with military technology imagery.","asset":{"_ref":"image-0da0843d838a4f370b5ce36c1c50e7cce03c7e38-3457x1945-png","_type":"reference"}},"meta":{"_type":"meta","description":"New products, places, and growth in another remarkable year.","title":"Anduril in 2023: A year in review","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"6158fd2b9c99","_ref":"88c2f47e-e9d4-4ab8-927e-f321d6a80c5c","_type":"reference"},{"_key":"e84d6892841f","_ref":"0bfd3b96-9764-4aa6-8118-dd05ed029171","_type":"reference"},{"_key":"f1de358c6cdc","_ref":"279b13c3-a23e-4a58-9bc9-e74ef3c52cc0","_type":"reference"}],"slices":[{"_key":"5b7f57408084","_type":"oneColumnRichText","content":[{"_key":"e806c563802d","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-0da0843d838a4f370b5ce36c1c50e7cce03c7e38-3457x1945-png","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"97b82e2bdac8","_type":"block","children":[{"_key":"f0cf19d82dd40","_type":"span","marks":[],"text":"Anduril was founded in 2017 with the lofty goal of becoming not only the next major defense prime, but one that operated on the principles of speed, innovation, and disruption of the status quo. At the time, we found the long-revered and feared capabilities of the U.S. armed forces that were once the inspiration for science fiction had been leapfrogged by innovations in commercial technology. The ingenuity of incumbent defense primes had stagnated amid misaligned incentives and crippling bureaucratic procedures. Yet we understood that software would be at the core of weapons systems of the future. And what we fundamentally believed then is now widely acknowledged today: Only superior military technology can credibly deter war."}],"markDefs":[],"style":"lead"},{"_key":"d2c567494829","_type":"block","children":[{"_key":"14bed1e3cbc3","_type":"span","marks":[],"text":"Much has changed since those early days when we started the company. Our geopolitical competitors seized the moment and exposed vulnerabilities in U.S. deterrence infrastructure. What was once deemed implausible has become reality: Russia's invasion of Ukraine now stands as one of the largest and most devastating land conflicts in Europe since the Second World War. In October, Hamas carried out one of the worst terrorist attacks in our lifetimes against the Israeli people, shifting regional instability to full-scale conflict. Meanwhile, China continues to saber rattle for forceful reunification with Taiwan by 2027 — a prospect that would result in disastrous geopolitical and economic ramifications for the world."}],"markDefs":[]},{"_key":"15683b726b41","_type":"block","children":[{"_key":"a36c91c6b6cb","_type":"span","marks":[],"text":"We are fortunate to be writing history rather than letting it pass us by. The systems we are building each and every day are helping to save lives and provide our customers with the means to defend themselves. And as we continue to build and grow, we can rest easy knowing that these efforts help safeguard our future from determined adversaries and strengthen our ability to deter great power conflict."}],"markDefs":[]},{"_key":"3d735b9f9e98","_type":"block","children":[{"_key":"de861ed6d2c2","_type":"span","marks":[],"text":"Anduril products are indeed deployed and making a difference for customers around the world right now: "},{"_key":"f0cf19d82dd41","_type":"span","marks":["bc0663d17a0a"],"text":"Sentry Towers"},{"_key":"f0cf19d82dd42","_type":"span","marks":[],"text":" are maintaining persistent situational awareness of military bases and numerous national and maritime borders. "},{"_key":"f0cf19d82dd43","_type":"span","marks":["4c48ec8671b7"],"text":"Anvil"},{"_key":"f0cf19d82dd44","_type":"span","marks":[],"text":" and "},{"_key":"f0cf19d82dd45","_type":"span","marks":["0397c9e88548"],"text":"Roadrunner"},{"_key":"f0cf19d82dd46","_type":"span","marks":[],"text":" stand ready to defeat adversary drones in austere locations. "},{"_key":"f0cf19d82dd47","_type":"span","marks":["5e5b220c5f21"],"text":"Ghost-X"},{"_key":"f0cf19d82dd48","_type":"span","marks":[],"text":" and "},{"_key":"f0cf19d82dd49","_type":"span","marks":["d5ee9bb983f4"],"text":"ALTIUS launched effects"},{"_key":"f0cf19d82dd410","_type":"span","marks":[],"text":" now fly over the battlefields of Ukraine. And our "},{"_key":"f0cf19d82dd411","_type":"span","marks":["4cb0cd3cca6a"],"text":"Lattice command and control software"},{"_key":"f0cf19d82dd412","_type":"span","marks":[],"text":" is now in use by every branch of the U.S. military along with many allies and partners."}],"markDefs":[{"_key":"bc0663d17a0a","_type":"internalLink","reference":{"_ref":"385b268e-8ce5-4c67-8825-257bd568a88b","_type":"reference"},"targetBlank":false},{"_key":"4c48ec8671b7","_type":"internalLink","reference":{"_ref":"29f7e0fc-6b26-45fd-a0a5-c55f3018aa82","_type":"reference"},"targetBlank":false},{"_key":"0397c9e88548","_type":"internalLink","reference":{"_ref":"af79ff2e-ad51-45a3-a99b-9b36796081c2","_type":"reference"},"targetBlank":false},{"_key":"5e5b220c5f21","_type":"internalLink","reference":{"_ref":"9077e6b2-41b7-454c-8945-6b7747e0bf6e","_type":"reference"},"targetBlank":false},{"_key":"d5ee9bb983f4","_type":"internalLink","reference":{"_ref":"dcca08af-1047-4f8e-820d-0a05e1ece758","_type":"reference"},"targetBlank":false},{"_key":"4cb0cd3cca6a","_type":"internalLink","reference":{"_ref":"9f2ad059-2bd9-48e9-9006-2e1891937e73","_type":"reference"},"targetBlank":false}]},{"_key":"2ae2a37bcee4","_type":"block","children":[{"_key":"ccde33f933e1","_type":"span","marks":[],"text":"There is no better validation of the work that we do than seeing the trust our customers place in Anduril and our products. And that trust is all due to the tireless efforts of our incredible Anduril team. What we achieved this year is thanks to the dedication and hard work of more than 2,400+ Andurilians all around the world. We are profoundly grateful for their sacrifices, the relentless effort they have put in, and the unmatched innovations they had a hand in delivering."}],"markDefs":[]},{"_key":"a51536afa799","_type":"block","children":[{"_key":"a50ddf9cc547","_type":"span","marks":[],"text":"The snapshot below provides a good summary of what we accomplished in 2023. This represents only a fraction of everything our talented team has built this year, but we hope it provides a sense of the remarkable impact of Anduril’s work. Thank you to everyone who made this another successful year for Anduril — employees, investors, partners, supporters, and so many others. We wish you all a restful and restorative holiday season!\n"}],"markDefs":[{"_key":"bc0663d17a0a","_type":"internalLink","reference":{"_ref":"385b268e-8ce5-4c67-8825-257bd568a88b","_type":"reference"},"targetBlank":false},{"_key":"4c48ec8671b7","_type":"internalLink","reference":{"_ref":"29f7e0fc-6b26-45fd-a0a5-c55f3018aa82","_type":"reference"},"targetBlank":false},{"_key":"0397c9e88548","_type":"internalLink","reference":{"_ref":"af79ff2e-ad51-45a3-a99b-9b36796081c2","_type":"reference"},"targetBlank":false},{"_key":"5e5b220c5f21","_type":"internalLink","reference":{"_ref":"9077e6b2-41b7-454c-8945-6b7747e0bf6e","_type":"reference"},"targetBlank":false},{"_key":"d5ee9bb983f4","_type":"internalLink","reference":{"_ref":"dcca08af-1047-4f8e-820d-0a05e1ece758","_type":"reference"},"targetBlank":false},{"_key":"4cb0cd3cca6a","_type":"internalLink","reference":{"_ref":"9f2ad059-2bd9-48e9-9006-2e1891937e73","_type":"reference"},"targetBlank":false}]},{"_key":"2f0c2c938169","_type":"block","children":[{"_key":"466d1793eb090","_type":"span","marks":[],"text":"New People, Places, and Company Growth"}],"markDefs":[],"style":"h2"},{"_key":"4d2204c0088b","_type":"block","children":[{"_key":"5ccd1f277ec70","_type":"span","marks":[],"text":"We had another remarkable year of growth at Anduril. We onboarded more than 1,000 new teammates to grow our team to more than 2,400 people across locations in the United States, United Kingdom, Australia, and other areas of the world. Some of this growth came through acquisitions: In June, we completed our acquisition of "},{"_key":"5ccd1f277ec71","_type":"span","marks":["c8949337ccde"],"text":"solid rocket motor supplier, Adranos"},{"_key":"5ccd1f277ec72","_type":"span","marks":[],"text":", which is now our Rocket Motor Systems division. In September, we "},{"_key":"5ccd1f277ec73","_type":"span","marks":["24c1da90817b"],"text":"acquired Blue Force Technologies"},{"_key":"5ccd1f277ec74","_type":"span","marks":[],"text":", a developer of autonomous aircraft with an integrated aerostructures division serving a wide range of defense and commercial customers. These deals expanded our footprint to Mississippi, Indiana, and North Carolina. Meanwhile, we expanded our facilities at our Headquarters in Costa Mesa, California, with the opening of a new 190,000 square-foot manufacturing and research and development facility."}],"markDefs":[{"_key":"c8949337ccde","_type":"internalLink","reference":{"_ref":"87e16269-d9c4-490c-ac19-8fb507ae90c6","_type":"reference"},"targetBlank":false},{"_key":"24c1da90817b","_type":"internalLink","reference":{"_ref":"9aa3b10e-c80a-49d0-8f4e-dd5dfd2da088","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"d45878968ad6","_type":"block","children":[{"_key":"c21916b1b65c","_type":"span","marks":[],"text":"Additionally, we hosted another amazing "},{"_key":"5ccd1f277ec75","_type":"span","marks":["4efad2b733e5"],"text":"class of about 100 interns"},{"_key":"5ccd1f277ec76","_type":"span","marks":[],"text":" from schools around the nation. We also brought on retired "},{"_key":"5ccd1f277ec77","_type":"span","marks":["362c06e3cad8"],"text":"Army Lt. Gen. Neil Thurgood"},{"_key":"5ccd1f277ec78","_type":"span","marks":[],"text":" as senior strategy advisor; "},{"_key":"5ccd1f277ec79","_type":"span","marks":["dffcf7f0a8a5"],"text":"Richard Drake"},{"_key":"5ccd1f277ec710","_type":"span","marks":[],"text":" to lead our efforts in the United Kingdom; and "},{"_key":"5ccd1f277ec711","_type":"span","marks":["e6d583d65827"],"text":"Keith Flynn"},{"_key":"5ccd1f277ec712","_type":"span","marks":[],"text":" to oversee and scale our manufacturing operations as Anduril’s first Senior Vice President of Manufacturing.\n"}],"markDefs":[{"_key":"4efad2b733e5","_type":"internalLink","reference":{"_ref":"a6a9e3c1-8638-48a4-9a63-885486cd9d36","_type":"reference"},"targetBlank":false},{"_key":"362c06e3cad8","_type":"link","href":"https://blog.anduril.com/anduril-hires-lieutenant-general-neil-thurgood-announces-planned-expansion-to-huntsville-al-68811ce9c113"},{"_key":"dffcf7f0a8a5","_type":"internalLink","reference":{"_ref":"f9ab8d42-d7e3-47f8-a5cd-16b6cce25181","_type":"reference"},"targetBlank":false},{"_key":"e6d583d65827","_type":"internalLink","reference":{"_ref":"9f2b5c10-9154-4cd4-bce7-e400a702b6fd","_type":"reference"},"targetBlank":false}]},{"_key":"abcc64c6961e","_type":"block","children":[{"_key":"c8da6aeb6b640","_type":"span","marks":[],"text":"New Products"}],"markDefs":[],"style":"h2"},{"_key":"64f2d5c3a2d6","_type":"block","children":[{"_key":"c1f478b2e3730","_type":"span","marks":[],"text":"As always, we upgraded many of our existing products with new or enhanced capabilities and pushed those updates directly to warfighters. And we launched several exciting new products, including:\n"}],"markDefs":[],"style":"normal"},{"_key":"2a1c1a97411e","_type":"block","children":[{"_key":"cf6b827479f20","_type":"span","marks":["8bc35d689dc3","strong"],"text":"Lattice for Mission Autonomy"},{"_key":"cf6b827479f21","_type":"span","marks":[],"text":": A hardware-agnostic, end-to-end software platform that allows humans to employ autonomous systems in a way they never have before. This end-to-end software platform enables teams of diverse robotic assets to work together under human supervision to dynamically perform complex missions in any domain, extending reach, capabilities and situational awareness while enabling warfighters to make better decisions, faster."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"8bc35d689dc3","_type":"internalLink","reference":{"_ref":"23a1be6d-6c30-43ca-9783-5ceb43056891","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"660c275fda2a","_type":"block","children":[{"_key":"49195dcbfbc9","_type":"span","marks":["strong","f2d88c3cb464"],"text":"Ghost-X"},{"_key":"545381e4c9a6","_type":"span","marks":[],"text":": The newest and most capable variant of our Ghost autonomous aircraft, Ghost-X increases payload capacity and enhanced flight performance while allowing for advanced options such as long-range resilient communications, vision-based navigation, and alternate gimbals."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"f2d88c3cb464","_type":"internalLink","reference":{"_ref":"d789f2ce-cd6b-4130-bfe3-8c0be637467f","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"b7b812d37073","_type":"block","children":[{"_key":"f1356c06f025","_type":"span","marks":["strong","45449befbe97"],"text":"Anvil-M"},{"_key":"4bca907656c4","_type":"span","marks":[],"text":": A new explosive munitions variant of our autonomous Anvil interceptor drone that can effectively intercept and defeat threats from Group 1 and Group 2 unmanned aircraft systems."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"45449befbe97","_type":"internalLink","reference":{"_ref":"dbca8d60-5e67-48c5-bdea-1c557de9aa05","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"722b6c4fbe7f","_type":"block","children":[{"_key":"4095550ea9b5","_type":"span","marks":["strong","f66f92e02261"],"text":"Fury"},{"_key":"d59c5c9adacc","_type":"span","marks":[],"text":": A Group 5 autonomous air vehicle with fighter-like performance. Our acquisition of Blue Force Technologies expanded our existing fleet of autonomous assets to include large, high-performance aircraft such as Fury. Fury leverages proprietary rapid prototyping, digital engineering, and an open architecture to deliver next-generation flight performance with the flexibility to integrate heterogenous sensors and payloads to support air dominance missions."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"f66f92e02261","_type":"internalLink","reference":{"_ref":"9aa3b10e-c80a-49d0-8f4e-dd5dfd2da088","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"f957912ab709","_type":"block","children":[{"_key":"9dff9d7a865f","_type":"span","marks":["strong","605b6acfe91f"],"text":"Roadrunner"},{"_key":"aa69f6cd31b3","_type":"span","marks":[],"text":": A modular, twin-jet powered autonomous air vehicle with vertical takeoff-and-landing capability that can be customized for a variety of missions."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"605b6acfe91f","_type":"internalLink","reference":{"_ref":"88c2f47e-e9d4-4ab8-927e-f321d6a80c5c","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"9341aff26b43","_type":"block","children":[{"_key":"8443b2840d36","_type":"span","marks":["strong","10d4c2548bda"],"text":"Roadrunner-M"},{"_key":"7b03ef11c4c7","_type":"span","marks":[],"text":": Defining a radical new class of recoverable ground-based air defense capability, Roadrunner-M is a high-explosive variant of Roadrunner that can rapidly identify, intercept, and destroy aerial threats that are up to 100 times more expensive, or be recovered and reused at near-zero cost."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"10d4c2548bda","_type":"internalLink","reference":{"_ref":"88c2f47e-e9d4-4ab8-927e-f321d6a80c5c","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"79d6edf0bd6e","_type":"block","children":[{"_key":"d196bd606f9e","_type":"span","marks":[],"text":"New Partners"}],"markDefs":[],"style":"h2"},{"_key":"b40f063ce945","_type":"block","children":[{"_key":"1ae37085617a","_type":"span","marks":[],"text":"It’s not possible to list all our new partners due to customer sensitivities, but here are a few we can highlight:\n"}],"markDefs":[],"style":"normal"},{"_key":"90f9da6ae433","_type":"block","children":[{"_key":"55ab09036161","_type":"span","marks":["strong","2523120f7acf"],"text":"Hadrian"},{"_key":"9b48b6d71036","_type":"span","marks":[],"text":": We entered into a strategic partnership with Hadrian, a leader in advanced manufacturing, to supply and manufacture precision parts for Anduril’s suite of autonomous systems."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"2523120f7acf","_type":"link","href":"https://blog.anduril.com/anduril-industries-and-hadrian-announce-strategic-partnership-8b30ca79f23d"}],"style":"normal"},{"_key":"20f3816a5cce","_type":"block","children":[{"_key":"26db4ea34bf3","_type":"span","marks":["strong","a6de9fab0a86"],"text":"Aalyria"},{"_key":"5e8341daddf1","_type":"span","marks":[],"text":": We signed a teaming agreement with Aalyria to integrate key technologies that will advance joint all-domain command and control. The agreement facilitated integration of Aalyria’s networking orchestration platform, Spacetime, with Anduril’s open operating system for national security capabilities, Lattice."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"a6de9fab0a86","_type":"link","href":"https://blog.anduril.com/anduril-aalyria-partner-to-integrate-technologies-to-enhance-national-security-capabilities-2fcd22ca009b"}],"style":"normal"},{"_key":"f56a7f22da94","_type":"block","children":[{"_key":"ef5b88112fd6","_type":"span","marks":["strong","39d156e315d1"],"text":"GM Defense"},{"_key":"8dcf667c7819","_type":"span","marks":[],"text":": We entered into a teaming agreement with GM Defense, a subsidiary of General Motors, to collaborate on defense program capture activities. These include delivering autonomy solutions, battery electrification, and other new propulsion technologies, as well as those integrating the full range of Anduril technologies onto GM Defense mobility solutions."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"39d156e315d1","_type":"internalLink","reference":{"_ref":"e5ca8bb2-d9c9-45bc-82ea-e7f35e4ac16d","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"ec5bf538b409","_type":"block","children":[{"_key":"67df4ffa881f","_type":"span","marks":["strong","3aedb25eef14"],"text":"NOWRDC"},{"_key":"180d0eb40bdc","_type":"span","marks":[],"text":": We entered into a partnership with the National Offshore Wind Research and Development Consortium (NOWRDC) to autonomously inspect undersea power infrastructure."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"3aedb25eef14","_type":"link","href":"https://blog.anduril.com/anduril-announces-autonomous-undersea-cable-inspection-project-cedafe42e72c"}],"style":"normal"},{"_key":"9a36b66a6d7d","_type":"block","children":[{"_key":"fba864ed51fa","_type":"span","marks":["strong","84815698a239"],"text":"Epirus"},{"_key":"096ebecadc50","_type":"span","marks":[],"text":": We partnered with Epirus to integrate Leonidas, a high-power microwave counter-swarm defeat capability, into Anduril’s Lattice software. This integration provided new defeat capability for Anduril’s family of systems to better counter unmanned threats."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"84815698a239","_type":"link","href":"https://blog.anduril.com/anduril-and-epirus-integration-leads-to-new-counter-uas-capability-bc6577789280"}],"style":"normal"},{"_key":"0c44be3eaeb0","_type":"block","children":[{"_key":"cded2ddfa17e","_type":"span","marks":[],"text":"Demonstrations and Events"}],"markDefs":[],"style":"h2"},{"_key":"204a3c149a26","_type":"block","children":[{"_key":"05ebbb59d6ae","_type":"span","marks":[],"text":"We hosted countless demonstrations and events for government and industry partners this year. Here are a few we can talk about:\n"}],"markDefs":[],"style":"normal"},{"_key":"061d81076b26","_type":"block","children":[{"_key":"c7803e41d512","_type":"span","marks":["strong","1bf74dfc4bdc"],"text":"EDGE23"},{"_key":"6fb61d57df5b","_type":"span","marks":[],"text":": Lattice for Mission Autonomy was successfully demonstrated during this U.S. Army exercise at Yuma Proving Ground, where an integrated team of multiple uncrewed aircraft successfully located, identified, and destroyed a mock surface-to-air missile (SAM) site in support of soldiers conducting Army helicopter assault operations."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"1bf74dfc4bdc","_type":"link","href":"https://blog.anduril.com/anduril-demonstrates-lattice-for-mission-autonomy-controlling-teams-of-autonomous-assets-at-us-f617c489441"}],"style":"normal"},{"_key":"27585a4f7910","_type":"block","children":[{"_key":"934463612902","_type":"span","marks":["strong","79f11fdd4e81"],"text":"Northern Edge:"},{"_key":"e61b142a2177","_type":"span","marks":[],"text":" We participated in this Indo-Pacific Command-sponsored exercise with two Menace integrated command and control hardware systems. Notably, Anduril constructed and delivered the ISO container variant, Menace for ISO, and a Menace for Ultralight Tactical Vehicle (ULTV) prototype over a 90-day period for the Marine Corps Warfighting Lab (MCWL), the U.S. Air National Guard, and Air Force Reserve Command Test Center (AATC), respectively."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"79f11fdd4e81","_type":"link","href":"https://blog.anduril.com/anduril-showcases-new-technology-at-indopacoms-northern-edge-23-1-exercise-8230da692c7d"}],"style":"normal"},{"_key":"d0c218260e5f","_type":"block","children":[{"_key":"7ef6cd4cbf97","_type":"span","marks":["strong","6e0e767aade5"],"text":"WTI"},{"_key":"ca120823105c","_type":"span","marks":[],"text":": At the U.S. Marine Corps’ Weapons and Tactics Instructor (WTI) course in Yuma, Arizona, Anduril demonstrated Menace-X for the first time. Prospective Weapons and Tactics instructors used the full capabilities of Menace-X to enable forward-deployed, integrated mesh networks for secure, low-latency sharing of time-sensitive mission data from operationally-relevant joint battle-networks."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"6e0e767aade5","_type":"internalLink","reference":{"_ref":"03160a78-330e-4496-9a0f-e0b47aa12094","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"511e00b2d355","_type":"block","children":[{"_key":"8ec1090a44ea","_type":"span","marks":["strong","c53cefa97b28"],"text":"ALTIUS-600 UK Milestone"},{"_key":"ed9282e54337","_type":"span","marks":[],"text":": In partnership with Leonardo UK, Anduril engineers completed a series of live trials of new technologies which will underpin the development of Air Launched Effects (ALE) capabilities. Air Launched Effects include releasing and controlling drones in mid-air from host aircraft."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"c53cefa97b28","_type":"link","href":"https://blog.anduril.com/altius-600-achieves-uk-milestone-in-ale-test-with-leonardo-ba8e09804627"}],"style":"normal"},{"_key":"ce6f6cb8302b","_type":"block","children":[{"_key":"a766f9afaa79","_type":"span","marks":["strong","130dfd6045d7"],"text":"Space Surveillance Network"},{"_key":"84c7fcb16c4d","_type":"span","marks":[],"text":": After a severe storm resulted in widespread power outages and damage to infrastructure across the Hawaiian islands, to include degradation of legacy communications at the Maui SSN site, Anduril restored operational communications within 24 hours until legacy communications could be restored three weeks later."}],"level":1,"listItem":"bullet","markDefs":[{"_key":"130dfd6045d7","_type":"link","href":"https://blog.anduril.com/anduril-delivers-commercial-data-transport-resilience-to-space-surveillance-network-31ca53f99fe5"}],"style":"normal"},{"_key":"0895fd175684","_type":"block","children":[{"_key":"28844cc6b365","_type":"span","marks":[],"text":"That’s all for 2023. Now, it’s onward and upward into 2024!"}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-in-2023-a-year-in-review"},"title":"Anduril in 2023: A year in review"},{"_createdAt":"2023-07-19T00:16:41Z","_id":"293b2a6e-259b-4913-b460-9de94c64cc68","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","authors":[{"_key":"d948f703-ec58-4f56-b273-0f9e2c7dcf48","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"b17aaac89bf4","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"},{"_key":"a58cf57eaa1d","_ref":"93421cd8-6498-4e99-a11f-fe55783b363f","_type":"reference"},{"_key":"dced9eb050ce","_ref":"f84a91e1-010a-4e53-853b-2c9f005edbda","_type":"reference"}],"date":"2022-06-05","image":{"_type":"imageWithMeta","alt":"Historic military manufacturing facility with rows of armored vehicles under construction.","asset":{"_ref":"image-80f65c20c879a2fe9e28b346e3aa0915f65508c5-1920x1400-jpg","_type":"reference"}},"meta":{"_type":"meta","description":"Help us to rebuild the arsenal of democracy and make that future safe, prosperous, and free.","title":"Rebooting the Arsenal of Democracy: Anduril Mission Document","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"ceeb890d1eca","_ref":"32719de1-93e9-4884-a9f1-948d06259a8e","_type":"reference"},{"_key":"b91fa328c2f5","_ref":"cc30a4a8-574c-4269-afe3-2f465f1bd15c","_type":"reference"},{"_key":"27c32e44eb06","_ref":"77437e63-70e7-41f1-9a11-a9adfc914449","_type":"reference"}],"slices":[{"_key":"ded6c120a657","_type":"twoColumnRichText","backgroundColor":{"_ref":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_type":"reference"},"column1":[{"_key":"51359d7bfa26","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-42b006950ed9a94a84954a836f2f1684df14646d-7701x5137-jpg","_type":"reference"}},"style":"center"},{"_key":"28b77cee3bc5","_type":"block","children":[{"_key":"42983bfb906d","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"}],"column2":[{"_key":"aacbb4de1fab","_type":"block","children":[{"_key":"06eb94c532ee","_type":"span","marks":["em"],"text":"Visit "},{"_key":"9f5dd27ba6a4","_type":"span","marks":["em","1f259fe6ba5f"],"text":"rebootingthearsenal.com"},{"_key":"9a728b0d895d","_type":"span","marks":["em"],"text":"."}],"markDefs":[{"_key":"1f259fe6ba5f","_type":"link","href":"https://rebootingthearsenal.com"}],"style":"normal"},{"_key":"bfb9bbc6eee1","_type":"block","children":[{"_key":"a65f1ffeed82","_type":"span","marks":[],"text":"0. What We Believe"}],"markDefs":[],"style":"h2"},{"_key":"b802d3eaed9e","_type":"block","children":[{"_key":"14f16a0ea941","_type":"span","marks":[],"text":"1. Introduction"}],"markDefs":[],"style":"h2"},{"_key":"8337e7874a7e","_type":"block","children":[{"_key":"5b1d08df5d7f","_type":"span","marks":[],"text":"2. How Did We Get Here?"}],"markDefs":[],"style":"h2"},{"_key":"aeb0b23aa658","_type":"block","children":[{"_key":"c04998b380c6","_type":"span","marks":[],"text":"3. The Defense Industry Today"}],"markDefs":[],"style":"h2"},{"_key":"08b6050bdf92","_type":"block","children":[{"_key":"a7c2a8c974b3","_type":"span","marks":[],"text":"4. The Rise of Software"}],"markDefs":[],"style":"h2"},{"_key":"ef1c01620b71","_type":"block","children":[{"_key":"bfd3ccb393ae","_type":"span","marks":[],"text":"5. A New Model"}],"markDefs":[],"style":"h2"},{"_key":"41e69b8d5c48","_type":"block","children":[{"_key":"5f7045b7d397","_type":"span","marks":[],"text":"6. The Government Response"}],"markDefs":[],"style":"h2"},{"_key":"b7696c912368","_type":"block","children":[{"_key":"a48e479cf37c","_type":"span","marks":[],"text":"7. Call to Action"}],"markDefs":[],"style":"h2"}],"columnRatio":"ratio-6-6"},{"_key":"5f867e5aa484","_type":"oneColumnRichText","content":[{"_key":"0210451df239","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-07338ea0aab31a24774e614e6dfec63d64f85e91-720x1065-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"1a0a3d1ac693","_type":"block","children":[{"_key":"bfdc2f8f55e60","_type":"span","marks":[],"text":"Only superior military technology can credibly deter war."}],"markDefs":[],"style":"lead"},{"_key":"7ed9daa7483f","_type":"block","children":[{"_key":"2c3e73c641460","_type":"span","marks":[],"text":"Since World War II, America and its allies’ lead in military technology has been the pivotal factor in preventing World War III."}],"markDefs":[],"style":"normal"},{"_key":"c139691f04dd","_type":"block","children":[{"_key":"c692e47a33330","_type":"span","marks":[],"text":"Today, that technological lead is in jeopardy."}],"markDefs":[],"style":"normal"},{"_key":"4715a419051f","_type":"block","children":[{"_key":"4afc6a58ac560","_type":"span","marks":[],"text":"The incumbent defense companies are unable to build the technology we need to reaffirm our technological lead."}],"markDefs":[],"style":"normal"},{"_key":"1362f1b675a2","_type":"block","children":[{"_key":"7cde35120df30","_type":"span","marks":[],"text":"We need a new breed of defense technology companies to reboot the arsenal of democracy."}],"markDefs":[],"style":"normal"},{"_key":"63f5898e7e7b","_type":"block","children":[{"_key":"ab9eafe304c90","_type":"span","marks":[],"text":"1 — Introduction"}],"markDefs":[],"style":"h1"},{"_key":"e20f233213cc","_type":"block","children":[{"_key":"c2c455b7c3940","_type":"span","marks":[],"text":"If you have followed world events for the last decade, you have felt something changing. The 20th century is well behind us, and with it the sense that America and its allied democracies are the undisputed leaders of the world. World War II — the last major war that America and its allies can truly be said to have won — feels awfully long ago."}],"markDefs":[],"style":"normal"},{"_key":"c19e2bac33d2","_type":"block","children":[{"_key":"1e4d25101d110","_type":"span","marks":[],"text":"The most glaring herald of our decline is in our military’s technology. Once upon a time, the armed services of the United States, United Kingdom, and their partners across the world were envied for their science fiction technology. Today, they are equipped with tools decades behind what you or I use every day. Software has, to paraphrase Marc Andreessen, tried to eat the world, but with the battlefield it found a meal too ungainly to digest."}],"markDefs":[],"style":"normal"},{"_key":"ec48fddd308d","_type":"block","children":[{"_key":"9714011071d30","_type":"span","marks":[],"text":"Despite spending more money than ever on defense, our military technology stays the same. There is more AI in a Tesla than in any U.S. military vehicle; better computer vision in your Snapchat app than in any system the Department of Defense owns; and, until 2019, the United States’ nuclear arsenal operated off floppy disks."}],"markDefs":[],"style":"normal"},{"_key":"1d52c8656646","_type":"block","children":[{"_key":"425372f0112b0","_type":"span","marks":[],"text":"The absence of a crisis made us complacent. In the aftermath of the Cold War, America and its allies felt invincible. Former Soviet states appeared to be liberalizing. China’s economy was growing, and most modernization theorists believed that the Chinese Communist Party would move inexorably toward open democracy. It was the end of history — the triumph of Western ideals and a new age of American-led world order."}],"markDefs":[],"style":"normal"},{"_key":"142af849f945","_type":"block","children":[{"_key":"754378ff782a0","_type":"span","marks":[],"text":"Until it wasn’t. Instead of acquiescing, our competitors seized the moment. China and Russia spent two decades harnessing our most powerful weapon — innovation — and built advanced weapon systems designed to neutralize and surpass our own. The results are sobering: today, in almost every wargame the United States Department of Defense models against China, China wins.¹"}],"markDefs":[],"style":"normal"},{"_key":"1a77e5950418","_type":"block","children":[{"_key":"2b7000ab71530","_type":"span","marks":[],"text":"All too quickly, we have reached the point where, in the words of General C.Q. Brown, “We must accelerate change, or lose.”"}],"markDefs":[],"style":"normal"},{"_key":"891b8e9104f8","_type":"block","children":[{"_key":"bb68afdfc0fd0","_type":"span","marks":[],"text":"There is a better way. Throughout World War II and the decades that followed, the West attracted the world’s most brilliant scientists and engineers, many of whom made foundational contributions to national defense. John von Neumann, Alan Turing, Kelly Johnson, the Jasons, and other gifted patriots recognized that our prosperity is only as strong as our means to defend it. Their technological innovations didn’t just bolster our military — many of their advances percolated into the consumer market. War research and development turned futuristic dreams into household staples: personal computing, GPS, the Internet, commercial air travel, and so much more."}],"markDefs":[],"style":"normal"},{"_key":"87745606d2ff","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-564348c06fa82b7656cfcc7cf7654bb31928bc6a-1588x1274-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"b5756aec0bc6","_type":"block","children":[{"_key":"650515b0635f0","_type":"span","marks":[],"text":"It is time to recapture that spirit of innovation and bring cutting-edge technology to our armed forces again. War in Eastern Europe, the looming threat of a Taiwan invasion, and a rising tide of security threats in other regions of the world demand it. This is not a matter of minor reform. It will require a major re-evaluation of what kinds of technology we build, how we build it, and the speed at which we move."}],"markDefs":[],"style":"normal"},{"_key":"017cca002a3c","_type":"block","children":[{"_key":"9544e1fcbd850","_type":"span","marks":[],"text":"Why can’t the existing defense companies simply do better? The largest defense contractors are staffed with patriots who nevertheless do not have the software expertise or business model to build the technology we need. Tomorrow’s weapons — autonomous systems, cyberweapons and defenses, networked systems, and more — are enabled through software, while these companies specialize in hardware. These companies work slowly, while the best engineers relish working at speed. And the software engineering talent who can build faster than our adversaries resides in the commercial sector, not at large defense primes. These companies built the tools that kept us safe in the past, but they are not the future of our defense."}],"markDefs":[],"style":"normal"},{"_key":"115cdffbee9a","_type":"block","children":[{"_key":"775bf5745d430","_type":"span","marks":[],"text":"We at Anduril are building defense technology in a new way, but we are just one company. If the allied democracies are to break free from the morass of bureaucracy, embedded habits, and mediocre technology that have failed our men and women in uniform for decades, we will need action at scale. Not just a handful, but dozens of new, innovative companies will be required to modernize our military. Tens of thou- sands of engineers will have to ask themselves if there is more to their careers than money alone. And our officials in government, without whom this effort will be for naught, will have to listen and to lead."}],"markDefs":[],"style":"normal"},{"_key":"2586ce1e3bb8","_type":"block","children":[{"_key":"341217bef1d40","_type":"span","marks":[],"text":"Some observers have suggested that young engineers do not wish to work on national security. We disagree — Silicon Valley was founded by patriots pushing science and engineering forward in the national interest and is filled with people eager to do the same again today. Others claim that it is impossible to compete with the defense giants. But the government has enthusiastically embraced nontraditional companies that get results like SpaceX and Palantir. And finally, the most pessimistic critics believe our effort to be futile because democratic leadership is in inexorable decline, as our adversaries hope it to be. We reject this. With the right technology, the right ways of building, and the right partners in the armed forces, we can build the systems that will safeguard the allied democracies for the next century and beyond."}],"markDefs":[],"style":"normal"},{"_key":"341351c1359e","_type":"block","children":[{"_key":"9c3e452425140","_type":"span","marks":[],"text":"2 — How Did We Get Here?"}],"markDefs":[],"style":"h2"},{"_key":"c9467b6591e5","_type":"block","children":[{"_key":"38fd3927d7ed","_type":"span","marks":[],"text":"In his eponymous memoir about the group, former Lockheed Skunk Works director Ben Rich tells two stories. One, for which he is best remembered, is a tale of aspiration and ingenuity. Alongside his iconoclastic predecessor, Kelly Johnson, Rich and his team of “skunks” designed and built vehicles that changed how the United States waged war and gathered intelligence: the U-2 spy plane, the SR-71 Blackbird, and the F-117 Nighthawk. Lockheed’s incredible record of innovation in the national interest is defense industry mythology; Rich’s memoir is practically mandated reading for patriotic engineers."}],"markDefs":[],"style":"normal"},{"_key":"a96c8da37ea9","_type":"block","children":[{"_key":"ab8747f7957c0","_type":"span","marks":[],"text":"The second story Rich tells, however, is less optimistic. Writing in 1994, Rich warns of a creeping decline among the major defense companies. “In my forty years at Lockheed,” he wrote, “I worked on twenty-seven different airplanes. Today’s young engineer will be lucky to build even "},{"_key":"ab8747f7957c1","_type":"span","marks":["em"],"text":"one"},{"_key":"ab8747f7957c2","_type":"span","marks":[],"text":".”² Not only were new things rarely being built, Rich observed, but the costs of even trying to do so had skyrocketed. “The development costs of fighters have increased by a factor of 100 since the 1950s, and unit procurement costs have risen 11 percent every year since 1963,” Rich despaired. “Small wonder, then, that there were only seven new airplanes in the 1980s, compared to forty-nine in the 1950s.”³"}],"markDefs":[],"style":"normal"},{"_key":"b5f244fb3477","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-6156f46158720e157170551e1ad294e171c02bdd-2003x2101-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"24a67f17f53b","_type":"block","children":[{"_key":"4ba7b08e6dac0","_type":"span","marks":[],"text":"Rich’s first story is history; his second is yet to conclude. The United States has not fielded a new bomber plane since the end of the Cold War. The F-35, one of the few new major systems the military is fielding, has become a byword for extravagance, currently estimated to cost taxpayers $1.6 trillion. And instead of attracting new entrants to fill the gaps, the Pentagon lost a staggering 20,500 suppliers from 2000 to 2018.⁴"}],"markDefs":[],"style":"normal"},{"_key":"8d45a4be7b84","_type":"block","children":[{"_key":"2cb8813a854d0","_type":"span","marks":[],"text":"When former Lockheed CEO Norm Augustine wrote that “In the year 2054, the entire defense budget will purchase just one aircraft,” he was joking — but not by much."}],"markDefs":[],"style":"normal"},{"_key":"6b3c4ec2a1b2","_type":"block","children":[{"_key":"6caebc9253410","_type":"span","marks":[],"text":"How did we get here? Understanding our present circumstances means understanding the history that preceded them. We do not have to delve far into the past — World War II and the years immediately following were a golden age of military innovation."}],"markDefs":[],"style":"normal"},{"_key":"4523a0af74a4","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-5e009cc4b8bb0ce4a4ad5993668171bdc9ab5d10-2470x1952-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"1fe92d9d105e","_type":"block","children":[{"_key":"de5ecd42bb8b0","_type":"span","marks":["strong"],"text":"The Golden Years"}],"markDefs":[],"style":"h2"},{"_key":"46a2db7a1d7f","_type":"block","children":[{"_key":"c59e2ae869500","_type":"span","marks":["em"],"text":"“It was the civilian scientists, not the military engineers, who had been the technological innovators during the war. ‘They are the ones who made the breakthroughs,’ [General Arnold] said. He predicted that those breakthroughs — in radar, in jet propulsion, in rocketry, in nuclear weapons — would prove to be the catalysts for further innovation that would radically alter the nature of war. The First World War had been decided by brawn, he said, the Second by logistics. ‘The Third World War will be different. It will be won by brains.’”"},{"_key":"c59e2ae869501","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"blockquote"},{"_key":"d1253df229cd","_type":"block","children":[{"_key":"d0726db7aaf5","_type":"span","marks":[],"text":""},{"_key":"c59e2ae869502","_type":"span","marks":["em"],"text":"–Neil Sheehan,"},{"_key":"c59e2ae869503","_type":"span","marks":[],"text":" A Fiery Peace in a Cold War"}],"markDefs":[]},{"_key":"7267a47b0883","_type":"block","children":[{"_key":"28a0154f683b0","_type":"span","marks":[],"text":"It can be difficult to imagine the Department of Defense, which today employs nearly 3 million Americans, moving quickly. But last century, it innovated at a speed that puts modern Silicon Valley startups to shame: the Pentagon was built in only 16 months (1941–1943), the Manhattan Project ran for just over 3 years (1942–1946), and the Apollo Program put a man on the moon in under a decade (1961–1969). In the 1950s alone, the United States built five generations of fighter jets, three generations of manned bombers, two classes of aircraft carriers, submarine-launched ballistic missiles, and nuclear-powered attack submarines."}],"markDefs":[],"style":"normal"},{"_key":"23858d3b858f","_type":"block","children":[{"_key":"8caf19e76d240","_type":"span","marks":[],"text":"Perhaps it should not surprise us that the government worked at the pace of a Silicon Valley startup, given that World War II and Cold War military research and development kickstarted Silicon Valley in the first place. Fred Terman, the “father of Silicon Valley,” had left Stanford in World War II to run the Harvard Radio Research Laboratory, the Department of Defense’s premiere electronic warfare lab. When he returned to Stanford after the war, he brought a wealth of government connections and influence with him. By 1947, the DoD provided half of Stanford School of Engineering’s budget. Federal government spending on science and engineering, much of it concentrated in Silicon Valley, continued to balloon — in 1960, the DoD accounted for 36% of "},{"_key":"8caf19e76d241","_type":"span","marks":["em"],"text":"all research and development in the world.⁶ ⁷"}],"markDefs":[],"style":"normal"},{"_key":"956599df0f46","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-867222c9f0e450afa7dbd14047feb9b67c0d4d24-1572x1466-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"62e67f0e1846","_type":"block","children":[{"_key":"ceb1ca438a510","_type":"span","marks":[],"text":"The DoD’s investments didn’t just benefit the military. Decades of military research sowed the seeds of prosperity in the consumer and enterprise sectors. The French media mogul and politician Jean- Jacques Servan-Schreiber, writing in 1967, marveled at the United States’ pace of innovation, predicting that “In thirty years America will be a post-industrial society… There will be only four work days a week of seven hours per day.”⁸"}],"markDefs":[],"style":"normal"},{"_key":"eca699f3a20a","_type":"block","children":[{"_key":"27569933185d0","_type":"span","marks":[],"text":"The commercial sector continued to advance — perhaps not as quickly as Servan-Schreiber imagined, but quickly enough for America to remain the most innovative country in the world."}],"markDefs":[],"style":"normal"},{"_key":"ea35b3abc50c","_type":"block","children":[{"_key":"1108d820cf9b0","_type":"span","marks":[],"text":"But, starting in the 1960s and intensifying through the 70s and 80s, the pace of military innovation began to slow, while costs grew. In 1955, it had become clear that the pace of defense spending was unsustainable: the federal government was spending more on defense than everything else "},{"_key":"1108d820cf9b1","_type":"span","marks":["em"],"text":"combined"},{"_key":"1108d820cf9b2","_type":"span","marks":[],"text":".⁹ Congress knew something had to change. Robert S. McNamara, a wunderkind World War II veteran with a sterling reputation for administrative efficiency at Ford Motor Company, was the man for the job."}],"markDefs":[],"style":"normal"},{"_key":"c7f78668720b","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-eedabb6fcd670df4b14b52e2a789055d77dbbff0-720x405-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"5ef269c9ee2c","_type":"block","children":[{"_key":"617e677a7fc60","_type":"span","marks":["strong"],"text":"A New Regime"}],"markDefs":[],"style":"h2"},{"_key":"eb8c83d58403","_type":"block","children":[{"_key":"49abcc140edb0","_type":"span","marks":[],"text":"In the early 1960s, under the direction of then Secretary of Defense McNamara, the Department of Defense instituted a labyrinth of new rules for acquiring military systems. McNamara was not merely reducing spending: his experience at Ford led him to believe that comprehensive reform was needed to reshape how the government bought technology. He revamped acquisitions to emphasize efficiency, the elimination of waste, and predictability. The Planning, Programming, and Budgeting System (PPBS, later changed to PPBE for “Execution”) process that he implemented is arguably the single most influential defense reform ever enacted, indelibly altering the incentives and business models of the major defense contractors."}],"markDefs":[],"style":"normal"},{"_key":"2b64deed42ea","_type":"block","children":[{"_key":"4ab6aab18f170","_type":"span","marks":[],"text":"Competition with the Soviet Union shaped McNamara’s actions — but perhaps not as modern observers would expect. Whereas today senior DoD leaders have rightly sounded the alarm on China’s ability to compete technologically with the West, McNamara did not believe the Soviet Union capable of out-innovating the United States. In the account of Brigadier General James M. Roherty, McNamara viewed the competition against the Soviet Union in terms of “quantifiables,” believing that “a relative stability characterized weapons technology in the 1960s… that ‘technological surprise’ [was] not a threat to national security and that major breakthroughs [were] not to be expected.”¹⁰"}],"markDefs":[],"style":"normal"},{"_key":"407b3bcef777","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-1c2cac629f008b9855480ef08e51c8c77617117f-2237x2280-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"114deb67da5e","_type":"block","children":[{"_key":"d2a8e8adcd250","_type":"span","marks":[],"text":"The primary focus of McNamara’s reforms was hence not innovation but cost control. He believed that, by and large, the United States already had the technology it needed to win the Cold War, and that the only problem was making sure that we didn’t spend ourselves into oblivion. The headline-grabbing arms races against the Soviet Union — the “missile gap,” the “bomber gap” — reflected differences in quantity, not quality, of military systems."}],"markDefs":[],"style":"normal"},{"_key":"54028b6fdb9c","_type":"block","children":[{"_key":"15e26229bb770","_type":"span","marks":[],"text":"McNamara’s reforms were not wrong: they were built for a specific era with specific characteristics. Those characteristics included the federal government conducting the vast majority of research and development, rather than private companies; the overwhelming importance of large, capital-intensive, “exquisite” military systems like tanks and battleships; a predictability in the adversary’s (the Soviet Union’s) rate of technological progress; and the existence of relatively few companies able to muster the capital and expertise to build military technology."}],"markDefs":[],"style":"normal"},{"_key":"880d25cff8b6","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-8c633985a8ae8ff905b127d09b0eeabeacc1012b-1000x667-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"f89421c5fa16","_type":"block","children":[{"_key":"e355ed96d07c","_type":"span","marks":[],"text":"All of those things have, to varying degrees, changed, but our system for buying technology has not. As a result, the large defense companies have learned to operate in highly idiosyncratic ways, unlike major companies in any other industry:"}],"markDefs":[],"style":"normal"},{"_key":"034b1d49162b","_type":"block","children":[{"_key":"acef5e5780ce0","_type":"span","marks":["strong"],"text":"1. Adherence to a Lengthy Bureaucratic Process"}],"markDefs":[],"style":"normal"},{"_key":"83adef6047a7","_type":"block","children":[{"_key":"975f0f0dc8040","_type":"span","marks":[],"text":"Under the PPBS system, before the government even considers purchasing a new military system, it embarks upon a years-long process of defining requirements, deciding where and how to allocate resources, and finally releasing an award for a new system. It is extremely difficult for the Department of Defense to rapidly acquire new technology, and as a result defense companies face no pressure to develop new systems quickly. Technology developed in the commercial sector hence takes years or decades to end up on the battlefield, if it does at all."}],"markDefs":[],"style":"normal"},{"_key":"39d732a631da","_type":"block","children":[{"_key":"8165cb21bb090","_type":"span","marks":["strong"],"text":"2. Working off Onerous System Specifications"}],"markDefs":[],"style":"normal"},{"_key":"5ef946d092ff","_type":"block","children":[{"_key":"58fe304819a20","_type":"span","marks":[],"text":"Reflecting the prevailing belief that industry was re- quired to execute, not innovate, to beat the Soviet Union, the requirements for major military programs are spelled out in extensive detail. Unlike most industries, which are driven forward by the creativity of the most successful companies, defense contractors are rarely asked to find creative ways to solve problems, and are sometimes punished for doing so."}],"markDefs":[],"style":"normal"},{"_key":"6297ad1c55bb","_type":"block","children":[{"_key":"9e0d9f99fc9a0","_type":"span","marks":["strong"],"text":"3. Spending Little on Internal Research & Development"}],"markDefs":[],"style":"normal"},{"_key":"6107b1f383f1","_type":"block","children":[{"_key":"9c322b410e610","_type":"span","marks":[],"text":"Because McNamara’s reforms made it exceptionally difficult to buy new technology quickly or to buy technology for which there is no defined requirement, defense companies rarely develop products of their own accord. Typically, they sell existing systems (which was most of their business under McNamara) or they wait for the government to order specific R&D efforts, for which they are directly compensated. For a comparison, the largest technology companies today — whose revenues vastly exceed those of the largest defense companies — spend roughly 10–20% of their revenue on research and development. Newer or mid-sized technology startups might spend closer to 60% or 70%. The major defense companies spend 1–4%.¹¹"}],"markDefs":[],"style":"normal"},{"_key":"3268678f9c39","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-156b7d94b0185ee7ba41f7c87af7e80e9b3e18ca-2003x2371-jpg","_type":"reference"}},"imageWidth":"60","style":"center"},{"_key":"7e6ddd5eb8b6","_type":"block","children":[{"_key":"721206ef8ffb0","_type":"span","marks":["strong"],"text":"4. Prioritizing Proposals Over Performance"}],"markDefs":[],"style":"normal"},{"_key":"db343144d339","_type":"block","children":[{"_key":"721f864dd6320","_type":"span","marks":[],"text":"McNamara believed duplicative programs to be at the root of DoD waste and would not tolerate government spending on multiple development efforts for similar new systems, whether between military services or among different vendors. This means that once a company is awarded a major contract, it is extremely difficult to take it from them. The incentive for large defense firms is hence to spend heavily on teams of lawyers and lobbyists to shape program requirements in line with the company’s existing technology. This political battle becomes just as important as building the product itself. These lobbyists are often former military officials: By 1969, over 2,000 military officers per year were leaving the DoD to work for a major defense contractor, three times as many as in 1959.¹³"}],"markDefs":[],"style":"normal"},{"_key":"10aded02038b","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-d0ac86d9fdd21a0a3213cbc6b1dbee597ff4b75a-1563x1538-jpg","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"1ec25b8c8bdb","_type":"block","children":[{"_key":"6cda356d37770","_type":"span","marks":["strong"],"text":"5. Tolerating Prolonged Failure"}],"markDefs":[],"style":"normal"},{"_key":"d92bc89635ee","_type":"block","children":[{"_key":"233922035b3c0","_type":"span","marks":[],"text":"In most industries, a company that fails to produce a functional product goes out of business. In the defense industry, when a company is three, five, ten years into a program and has failed to build what they promised, the government is stuck between a rock and a hard place — do they cancel the contract and throw away years of development, potentially bankrupting the vendor in the process? Or do they begrudgingly provide the vendor with even more money to salvage the program? Typically, it’s the latter. In the words of the infamous city planner Robert Moses, “Once you sink that first stake, they’ll never make you pull it up.”¹⁴"}],"markDefs":[],"style":"normal"},{"_key":"cd58a4897e1c","_type":"block","children":[{"_key":"72cd3a41d21e0","_type":"span","marks":[],"text":"This may simply be a poor decision (sunk cost fallacy), but sometimes it is part of a deliberate policy to pre- serve the “defense industrial base” — a critical mass of defense companies that can be called upon in an emergency. There is value to this policy, but it has significant costs. It creates moral hazard for major defense companies, which effectively become “too important to fail,” and ensures that not all contracts are given out meritocratically, blunting companies’ incentives to produce better products."}],"markDefs":[],"style":"normal"},{"_key":"3e843afc4cdd","_type":"block","children":[{"_key":"58de25bfdf3e0","_type":"span","marks":[],"text":"To reiterate, there were highly logical rationales for each of these rules and norms. Some of McNamara’s beliefs turned out to be wrong, but others were vindicated — the West won the Cold War, after all. One thing McNamara’s DoD got emphatically right was reducing the use of cost-plus-fixed-fee (CPFF) contracts from 38% of contracts awarded to just over nine percent (though by 2020 they had crept back up to comprise 38% of DoD’s contracts once again).¹⁵ ¹⁶ Cost-plus contracts pay vendors for the costs of developing and producing new systems, plus a percentage fee on top (typically 6–8%). This means that working quickly and efficiently often conflicts with contractors’ profit motives. In the words of Lt. Gen. James Stansberry, “Unless changes are made in the current profit system that demands higher costs as a prerequisite for higher profits, it is futile to expect lower costs… there is little economic motivation for contractors to reduce direct or indirect costs.”¹⁷"}],"markDefs":[],"style":"normal"},{"_key":"c7bc518a87a7","_type":"block","children":[{"_key":"176ec8e6e4bd0","_type":"span","marks":[],"text":"Ultimately, however, McNamara’s system was a bet that the United States could predict the future — that they had a good idea of how Soviet technological development would progress and that, with careful planning, the United States could remain ahead. That is simply no longer true. Our adversaries innovate incredibly quickly, partially because they have learned from the mistakes of the Soviets, partially because they have become incredibly adept at industrial espionage,¹⁸ and partially because
