ks":["em"],"text":"The Pentagon’s Brain: An Uncensored History of DARPA, America’s Top-Secret Military Research Agency"},{"_key":"83f6418ccf3d2","_type":"span","marks":[],"text":". 2015. p. 30."}],"markDefs":[],"style":"normal"},{"_key":"ee90308a004e","_type":"block","children":[{"_key":"1b71763cd1120","_type":"span","marks":[],"text":"³¹ Greenwalt, p. 35."}],"markDefs":[],"style":"normal"},{"_key":"86466dada6d2","_type":"block","children":[{"_key":"d9ddbece05030","_type":"span","marks":[],"text":"³² Arraf, Jane & Schmitt, Eric. “Iran’s Proxies in Iraq Threaten U.S. With More Sophisticated Weapons.” "},{"_key":"d9ddbece05031","_type":"span","marks":["em"],"text":"New York Times"},{"_key":"d9ddbece05032","_type":"span","marks":[],"text":", June 2021, "},{"_key":"d9ddbece05033","_type":"span","marks":["c19d54c345aa"],"text":"https://www.nytimes.com/2021/06/04/world/middleeast/iran-drones-iraq.html."}],"markDefs":[{"_key":"c19d54c345aa","_type":"link","href":"https://www.nytimes.com/2021/06/04/world/middleeast/iran-drones-iraq.html."}],"style":"normal"},{"_key":"c6570157b774","_type":"block","children":[{"_key":"f760d5f4fee30","_type":"span","marks":[],"text":"³³ Chaikin, Andrew. “Is SpaceX Changing the Rocket Equation?” "},{"_key":"f760d5f4fee31","_type":"span","marks":["em"],"text":"Smithsonian Magazine"},{"_key":"f760d5f4fee32","_type":"span","marks":[],"text":", January 2012, "},{"_key":"f760d5f4fee33","_type":"span","marks":["fe375ab480d5"],"text":"https://www.smithsonianmag.com/air-space-magazine/is-spacex-changing-the-rocket-equation-132285884/."}],"markDefs":[{"_key":"fe375ab480d5","_type":"link","href":"https://www.smithsonianmag.com/air-space-magazine/is-spacex-changing-the-rocket-equation-132285884/"}],"style":"normal"},{"_key":"d14d5be150e8","_type":"block","children":[{"_key":"a078a37ba4920","_type":"span","marks":[],"text":"³⁴ V. Roberts, Steven. “Congress: The Provocative Saga of the $400 Hammer.” "},{"_key":"a078a37ba4921","_type":"span","marks":["em"],"text":"The New York Times"},{"_key":"a078a37ba4922","_type":"span","marks":[],"text":", June 1984, "},{"_key":"a078a37ba4923","_type":"span","marks":["363f55a273bc"],"text":"https://www.nytimes.com/1984/06/13/us/congress-the-provacative-saga-of-the-400-hammer.html."}],"markDefs":[{"_key":"363f55a273bc","_type":"link","href":"https://www.nytimes.com/1984/06/13/us/congress-the-provacative-saga-of-the-400-hammer.html."}],"style":"normal"},{"_key":"6c4e31889ce8","_type":"block","children":[{"_key":"443b5165c4770","_type":"span","marks":[],"text":"³⁵ NYT staff. “Lockheed Is Accused of Waste and Deceit on C-5A.” "},{"_key":"443b5165c4771","_type":"span","marks":["em"],"text":"The New York Times"},{"_key":"443b5165c4772","_type":"span","marks":[],"text":", September 1971, "},{"_key":"443b5165c4773","_type":"span","marks":["4f4444e1ae7f"],"text":"https://www.nytimes.com/1971/09/30/archives/lockheed-is-accused-of-waste-and-deceit-on-c5a-lockheed-deceit-on.html."}],"markDefs":[{"_key":"4f4444e1ae7f","_type":"link","href":"https://www.nytimes.com/1971/09/30/archives/lockheed-is-accused-of-waste-and-deceit-on-c5a-lockheed-deceit-on.html."}],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"rebooting-the-arsenal-of-democracy-anduril-mission-document"},"title":"Rebooting the Arsenal of Democracy: Anduril Mission Document"}],"slices":[{"_key":"649b51544455","_type":"oneColumnRichText","content":[{"_key":"489a6d676e3b","_type":"block","children":[{"_key":"14f9b34d672a","_type":"span","marks":["strong","em"],"text":"Anduril is investing $75 million to increase manufacturing and production capacity for solid rocket motors, creating more than 60 jobs in Stone County, MS by December 2024."}],"markDefs":[{"_key":"0ac46d8f343b","_type":"link","href":"https://acceleratems.org/"}],"style":"lead"},{"_key":"8986460a45c5","_type":"block","children":[{"_key":"b4606965216a0","_type":"span","marks":[],"text":"Anduril Industries is expanding its solid rocket motor production facility in McHenry, Mississippi as part of the company’s efforts to address the country’s most urgent capability gaps quickly, including its limited supply of solid rocket motors and solid rocket motor production in the US. Anduril is investing more than $75 million to increase the propellant mixing and solid rocket motor annual production capacity from 600 to more than 6,000 tactical-scale solid rocket motors, to support growing demand from customers and establish itself as America’s newest independent merchant supplier of rocket motors."}],"markDefs":[],"style":"normal"},{"_key":"4555e46a88f7","_type":"block","children":[{"_key":"0fe3081418f90","_type":"span","marks":[],"text":"The investment will allow Anduril to significantly expand the Mississippi Solid Rocket Motor Complex, a 450-acre propellant mixing and solid rocket motor production facility that has been sited for millions of pounds of explosives. In addition, Anduril will use the capital to renovate 92,000 square feet of factory space, adding advanced robotics equipment and modular manufacturing systems that will allow Anduril to continue to build rocket motors faster and at lower cost than currently available from traditional suppliers."}],"markDefs":[],"style":"normal"},{"_key":"2f586de0ec6d","_type":"block","children":[{"_key":"fb4e7a4e0dda0","_type":"span","marks":[],"text":"Anduril brings a new approach to the development of solid rocket motors. Anduril has developed an innovative process for SRM production that is significantly faster, requires less manual labor, is more reliable, and is more efficient than legacy production techniques. In addition to traditional, aluminized solid rocket motors, Anduril manufactures propulsion systems using ALITEC, a proprietary rocket fuel. ALITEC releases more energy per unit, extending the range, payload capacity and speed of missile systems by up to 40 percent."}],"markDefs":[],"style":"normal"},{"_key":"3b90cd65ff02","_type":"block","children":[{"_key":"b7af04a7115c0","_type":"span","marks":[],"text":"To support production growth, Anduril is actively hiring for more than 60 new highly skilled roles in Stone County, which it hopes to fill by the end of 2024. Anduril is looking for software and hardware engineers, machinists, chemists, manufacturing technicians, production managers and supply chain specialists."}],"markDefs":[],"style":"normal"},{"_key":"994fccc57d12","_type":"block","children":[{"_key":"6fb16d0621400","_type":"span","marks":[],"text":"Anduril is expanding the defense industrial base and accelerating the development and production of capabilities that are critical to national security. Anduril combines modern software expertise with a rapid and differentiated approach to hardware development and manufacturing. From cutting-edge counter drone systems to extra-large autonomous underwater vehicles to solid rocket motors, Anduril has proven it can deliver highly-performant, next-generation, software-defined capabilities on a timeline and scale that matters."}],"markDefs":[],"style":"normal"},{"_key":"c13f260f6342","_type":"block","children":[{"_key":"f5904c5ac4870","_type":"span","marks":[],"text":"The Mississippi Development Authority is providing assistance through the Mississippi Flexible Tax Incentive, or MFLEX, program. MDA is also assisting with building and site improvements. Stone County and "},{"_key":"62c5be0dd318","_type":"span","marks":["4b187aa75954"],"text":"AccelerateMS"},{"_key":"39f867474ef6","_type":"span","marks":[],"text":" are assisting with the project, as well."}],"markDefs":[{"_key":"4b187aa75954","_type":"link","href":"https://acceleratems.org/"}],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-expands-solid-rocket-motor-production-facility"},"title":"Anduril Expands Solid Rocket Motor Production Facility"},{"_createdAt":"2024-06-14T14:00:41Z","_id":"d3e495ba-63ef-4349-992b-f539b283df0f","_rev":"ESvEjc6swyeoEqIQr9k7NW","_type":"article","_updatedAt":"2026-04-08T01:28:18Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_rev":"8QtQE8S3U2lXjdjxKMFvCL","_type":"person","_updatedAt":"2025-11-18T00:08:12Z","bio":[],"fullName":"Anduril Industries","image":{"_type":"image","asset":{"_ref":"image-a990fb8ef1bae814dc01807f8757917489c9e64d-2536x2536-jpg","_type":"reference"}},"metadata":null,"slug":{"_type":"slug","current":"anduril-industries"}}],"categories":[{"_createdAt":"2025-04-10T03:57:42Z","_id":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_rev":"eBmLOIrMzK4fuf6o6EXXw6","_type":"articleCategory","_updatedAt":"2025-09-30T19:16:31Z","metadata":null,"slug":{"_type":"slug","current":"news"},"title":"News"}],"date":"2024-06-17","image":{"_type":"imageWithMeta","alt":"Anduril autonomous underwater vehicle with USA markings against cloudy sky.","asset":{"_id":"image-c12c248110d7e242f984149e221a7966b0e7cad3-6048x4024-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.502982107355865,"height":4024,"width":6048},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","description":"The Rhode Island production facility will enable Anduril to increase production to 200 AUVs per year and create more than 100 jobs over the next five years. The factory announcement comes amid growing demand for Anduril's AUVs, including an $18.6 million contract with the U.S. Navy.","title":"Anduril to Open Large Scale Production Facility for Autonomous Underwater Vehicles","type":"article"},"metadata":null,"parent":{"_createdAt":"2025-03-18T06:18:29Z","_id":"cb940787-64b7-481d-8379-537ea6a1cf56","_rev":"N1G5rtOZj8187JlhVNj8ZV","_system":{"base":{"id":"cb940787-64b7-481d-8379-537ea6a1cf56","rev":"U0oN0QIqDw3OWy2Rvws2n8"}},"_type":"page","_updatedAt":"2026-10-06T20:13:24Z","category":"company","meta":{"description":"The latest news, announcements, and insights from Anduril Industries.","title":"Newsroom"},"metadata":null,"slices":[{"_key":"be226df55718","_type":"navColorSlice","navColorMode":"dark"},{"_key":"862b9c27dddf","_type":"newsroomHeader","header":"News & Insights","headerLabel":"NEWSROOM","highlightedArticle":{"_type":"newsLink","link":{"_ref":"deba6017-6ea9-492e-a4f6-78f295f14d6a","_type":"reference"}}},{"_key":"54576d983b87","_type":"newsListSlice","header":"All articles"}],"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"relatedArticles":[{"_createdAt":"2024-02-08T14:38:23Z","_id":"a22d60cc-2ee0-4840-949d-b42cbd36090a","_rev":"Qy55Bpk20qPJqSMUUbsfzb","_type":"article","_updatedAt":"2026-04-08T01:28:56Z","authors":[{"_key":"78f01b2bc01e","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"47ccb3e9554d","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"}],"date":"2024-02-08","image":{"_type":"imageWithMeta","alt":"Red Anduril underwater vessel with illuminated logo submerged in ocean waters.","asset":{"_ref":"image-7907e15eee66539c21a6288fdfedf2afecb67373-2560x1440-jpg","_type":"reference"}},"meta":{"_type":"meta","description":"The U.S. Navy selected Anduril and its Dive family of large autonomous underwater vehicles (AUVs) to prototype distributed, long-range, persistent underwater sensing and payload delivery in contested environments.","title":"DIU Awards Anduril Contract to Innovate New Capabilities for Undersea Warfare","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"relatedArticles":[{"_key":"7c883548ead8","_ref":"6b7f1f61-1c2f-4eb8-8bef-60c36397b4cb","_type":"reference"},{"_key":"8041e7989d80","_ref":"8787e53e-96a6-43fb-8d8e-74024b98f70f","_type":"reference"},{"_key":"991d58b6a202","_ref":"bfc5bde3-7e64-41e5-9404-3571487c2fb3","_type":"reference"}],"slices":[{"_key":"45ef3d1457f9","_type":"oneColumnRichText","content":[{"_key":"e3fc09bbef31","_type":"block","children":[{"_key":"e42305c4d0bb0","_type":"span","marks":["strong"],"text":"Dive-LD is a flexible autonomous underwater vehicle, capable of rapidly integrating complex payloads and multi-sensor suites."}],"markDefs":[],"style":"lead"},{"_key":"ae2744741061","_type":"block","children":[{"_key":"d84c187f45f4","_type":"span","marks":[],"text":"The U.S. Navy selected Anduril and its Dive family of large autonomous underwater vehicles (AUVs) to prototype distributed, long-range, persistent underwater sensing and payload delivery in contested environments. Anduril provides a family of AI-enabled AUVs that are designed to perform a wide range of defense and commercial missions."}],"markDefs":[],"style":"normal"},{"_key":"818d3fb3bece","_type":"block","children":[{"_key":"6e3426af99740","_type":"span","marks":[],"text":"“Our selection takes place at a critical moment for the Department of Defense,” said Anduril CEO and Co-Founder Brian Schimpf. “In an era of strategic competition, our AUVs like Dive-LD provide urgently-needed capability to deter maritime threats around the world. We are excited to work with our U.S. Government partners as we look to build advanced, affordable, autonomous capabilities at scale in support of U.S. Navy priorities.”"}],"markDefs":[],"style":"normal"},{"_key":"a4336a66866f","_type":"block","children":[{"_key":"4ae8d0511ef20","_type":"span","marks":[],"text":"Amid rising tensions in the Indo-Pacific region, particularly in the maritime environment, the Department of Defense (DoD) signaled its intent to invest in large quantities of attritable autonomous systems to strengthen deterrence, project power, and achieve affordable mass. To that end, Dive-LD leverages commercial best practices to deliver unparalleled dominance in the undersea environment at rapid speed, massive scale, and low cost for a vehicle of this class."}],"markDefs":[],"style":"normal"},{"_key":"e53d6a0577fe","_type":"block","children":[{"_key":"c99e51b3ab670","_type":"span","marks":[],"text":"Mass is a critical element of undersea deterrence. But insufficient fielding of unmanned undersea vehicles with long endurance and large payload capabilities at scale has created a significant gap. In July 2023, DIU sought proposals for commercial solutions to fill that gap. As part of the selection process, Dive-LD carried out government-defined missions for DIU and U.S. government program sponsors during a “swim-off” competition that rigorously evaluated vehicle capabilities at the Naval Undersea Warfare Center in Newport, Rhode Island."}],"markDefs":[],"style":"normal"},{"_key":"23da0798385f","_type":"block","children":[{"_key":"770366361ca10","_type":"span","marks":[],"text":"During this event, Anduril engineers successfully tracked and shared the location of the Dive-LD asset with operators around the world in real-time by leveraging "},{"_key":"f9ea608fa1e1","_type":"span","marks":["b081d789c180"],"text":"Lattice"},{"_key":"c31f2ef22430","_type":"span","marks":[],"text":", Anduril’s AI-powered software platform for command-and-control (C2) of autonomous vehicles, highlighting how multiple operators, units, and watch floors can leverage Lattice for remote mission monitoring and execution. After the successful demonstration, Dive-LD was down-selected for a contract under DIU’s Commercial Solutions Opening process."}],"markDefs":[{"_key":"b081d789c180","_type":"internalLink","reference":{"_ref":"9f2ad059-2bd9-48e9-9006-2e1891937e73","_type":"reference"},"targetBlank":false}],"style":"normal"},{"_key":"4d63f6549853","_type":"block","children":[{"_key":"d06142097b2a0","_type":"span","marks":[],"text":"“Dive-LD is foundational to Anduril’s maritime capabilities for commercial and defense applications. By combining proven subsea vehicle development expertise with advanced manufacturing processes, the platform is quick to produce, economical to manufacture and service, simple to customize, and robust in operation,” said Anduril Chief Strategy Officer Chris Brose. “Dive-LD is the most reliable and flexible AUV on the market today, capable of rapidly integrating complex payloads or multi-sensor suites to provide advanced capability for a wide range of missions.”"}],"markDefs":[],"style":"normal"},{"_key":"67c2a63eef80","_type":"block","children":[{"_key":"becc481128d50","_type":"span","marks":[],"text":"Anduril is committed to providing the U.S. and its allies with asymmetric undersea advantage to deter conflict, and if necessary, fight and win. Driven by Anduril’s significant investments in long-range, autonomous undersea capabilities, Dive-LD has emerged as the leading solution for a variety of missions, including operational preparation of the environment, surveillance and reconnaissance, mine warfare, subsea and seabed warfare, seafloor mapping, and more."}],"markDefs":[],"style":"normal"},{"_key":"386a35c35c39","_type":"block","children":[{"_key":"4251a7cea64f0","_type":"span","marks":[],"text":"This is only the beginning of Anduril’s efforts to support critical maritime missions. As demonstrated in Australia with the signing of a co-development partnership alongside "},{"_key":"1d107e7118b7","_type":"span","marks":["935d76d5a453"],"text":"the Royal Australian Navy and the Defence Science and Technology Group on Extra Large Autonomous Undersea Vehicles (XLAUV)"},{"_key":"0b12959252d5","_type":"span","marks":[],"text":", Anduril is committed to advancing distributed maritime operations through large and extra-large autonomous subsurface capabilities. We look forward to working with DIU and other government partners under this prototyping program to deliver persistent, scalable, long-range undersea autonomous solutions for the U.S. Navy."}],"markDefs":[{"_key":"935d76d5a453","_type":"internalLink","reference":{"_ref":"6b7f1f61-1c2f-4eb8-8bef-60c36397b4cb","_type":"reference"},"targetBlank":false}],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"diu-awards-anduril-contract-to-innovate-new-capabilities-for-undersea-warfare"},"title":"DIU awards Anduril contract to innovate new capabilities for undersea warfare"},{"_createdAt":"2024-04-17T17:42:52Z","_id":"c60ac9b8-73ce-4dfa-8047-1a3aa39d6389","_rev":"RS0vWXjRQWPGuLISTMIe9d","_type":"article","_updatedAt":"2026-06-05T03:03:29Z","categories":[{"_key":"8f53828a53d1","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"}],"date":"2024-04-17","image":{"_type":"imageWithMeta","alt":"Black submarine named Ghost Shark docked at Australian port facility.","asset":{"_ref":"image-5e1e0585339ea5d7f27a450389e116326ca519ce-6000x4000-jpg","_type":"reference"}},"meta":{"_type":"meta","description":"Ghost Shark autonomous underwater vehicle makes its debut in Australia, showcasing advanced undersea defense capabilities.","title":"Ghost Shark Debuts in Australia","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"slices":[{"_key":"8cc512ea826d","_type":"oneColumnRichText","content":[{"_key":"bc8819ca666e","_type":"block","children":[{"_key":"af41e7e38b290","_type":"span","marks":[],"text":"Anduril, the Royal Australian Navy (RAN), the Advanced Strategic Capabilities Accelerator (ASCA) and Defence Science and Technology Group (DSTG) are pleased to unveil the first Ghost Shark manufactured prototype and announce that the Ghost Shark program is ahead of schedule and on budget. As Anduril moves to deliver an operationally relevant capability within a fraction of traditional defence timelines, early creation and testing of the first Ghost Shark has been critical for rapid learning and iteration."}],"markDefs":[],"style":"lead"},{"_key":"abc5c561af4c","_type":"block","children":[{"_key":"4dbad695d8fb0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"06a15ad9738b","_type":"block","children":[{"_key":"617cd169b2c20","_type":"span","marks":[],"text":"It’s a momentous advancement in the $140M co-development contract between RAN, DSTG and Anduril to design and develop the three ‘Ghost Shark’ extra-large autonomous undersea vehicles (XL-AUV) in three years in Australia."}],"markDefs":[],"style":"normal"},{"_key":"2b791e722602","_type":"block","children":[{"_key":"6c8f715ec72f0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"7edfe74db9c8","_type":"block","children":[{"_key":"46be0a77f7bb0","_type":"span","marks":[],"text":"Ghost Shark is a modular, multi-purpose capability that can flexibly respond to the Australian Defence Force’s mission requirements, creating an agile force multiplier for Defence."}],"markDefs":[],"style":"normal"},{"_key":"41d689f30007","_type":"block","children":[{"_key":"cc03ce5ba9170","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"3934c5316f1f","_type":"block","children":[{"_key":"7512e5eb580c0","_type":"span","marks":[],"text":"David Goodrich OAM, Executive Chairman and CEO Anduril Australia said: “The timeline we set to design and produce three Ghost Sharks in three years in Australia, by Australians for the ADF, was extremely ambitious. I am excited to report that we are ahead of schedule and, importantly for a Defence program, we are on budget."}],"markDefs":[],"style":"normal"},{"_key":"28986ca8e391","_type":"block","children":[{"_key":"091b43d65ec10","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"8397f6f9c075","_type":"block","children":[{"_key":"262bf54e2b150","_type":"span","marks":[],"text":"“We're moving incredibly quickly on this program in lockstep with our ASCA, DSTG and the RAN partners. The strategic leadership and innovation insights provided by Prof Tanya Monro, Prof Emily Hilder and Vice Admiral Mark Hammond are key to our success,” said Mr Goodrich."}],"markDefs":[],"style":"normal"},{"_key":"85da7df78fa0","_type":"block","children":[{"_key":"f88149b683420","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"7128f5123c5d","_type":"block","children":[{"_key":"ff75ce15f0660","_type":"span","marks":[],"text":"Dr Shane Arnott, Senior Vice President Engineering, Anduril Industries said: “Moving at the speed of relevance is Anduril's signature. For Ghost Shark, we have assembled a unique high-powered engineering team of 121 people from the best-of-Australia, across tech, resources and defence, to fuel this progress."}],"markDefs":[],"style":"normal"},{"_key":"47a7b69d2310","_type":"block","children":[{"_key":"40648780d4fe0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"0c307cd80495","_type":"block","children":[{"_key":"998bd6c91bf80","_type":"span","marks":[],"text":"“We have 42 Australian companies currently working on Ghost Shark, which is being designed, engineered and manufactured in Australia. We plan to manufacture at scale in Australia for the Royal Australian Navy, and then for export to our allies and partners around the world."}],"markDefs":[],"style":"normal"},{"_key":"2effd0a89ce5","_type":"block","children":[{"_key":"d682a04c90a80","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"54c4509e81ac","_type":"block","children":[{"_key":"05ce3e3cb9980","_type":"span","marks":[],"text":"“Using novel scaled agile development techniques, we are combining both tech and defence sector development practices - and it’s paying big dividends. Ghost Shark is a program that we as Australians can be very proud of,” said Dr Arnott."}],"markDefs":[],"style":"normal"},{"_key":"d30f70626cbf","_type":"block","children":[{"_key":"ded4f5d01c4c0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"8878ed094512","_type":"block","children":[{"_key":"044c5e8679f30","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"893b86516790","_type":"block","children":[{"_key":"0072358130580","_type":"span","marks":["strong"],"text":"Quotes attributable to Minister for Defence Industry, Pat Conroy:"}],"markDefs":[],"style":"normal"},{"_key":"539984c4857f","_type":"block","children":[{"_key":"8aa6c76be5da0","_type":"span","marks":[],"text":"“Ghost Shark is an exemplar of how Defence and Australian industry can move at speed to develop new sovereign capabilities to respond to the challenges before us."}],"markDefs":[],"style":"normal"},{"_key":"a29ac0954086","_type":"block","children":[{"_key":"ef26a0aafba80","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"8628e900456b","_type":"block","children":[{"_key":"0ab4780943c00","_type":"span","marks":[],"text":"“By transitioning Ghost Shark to ASCA, a clear statement is being made about Defence’s commitment to the program."}],"markDefs":[],"style":"normal"},{"_key":"40e95b589fce","_type":"block","children":[{"_key":"abce5171437a0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"58a9eb6bf523","_type":"block","children":[{"_key":"8dea66db8f190","_type":"span","marks":[],"text":"“ASCA is focussed on speeding up the transition of innovation into capability that will give our Australian Defence Force an edge, while creating more jobs for Australians commercialising the technology.”"}],"markDefs":[],"style":"normal"},{"_key":"c926439bc489","_type":"block","children":[{"_key":"a83e018507330","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"a579588ae789","_type":"block","children":[{"_key":"fc7d083134880","_type":"span","marks":["strong"],"text":"Quotes attributable to Chief of Navy, Vice Admiral Mark Hammond:"}],"markDefs":[],"style":"normal"},{"_key":"c46484a06c5d","_type":"block","children":[{"_key":"301752d281e20","_type":"span","marks":[],"text":"“This collaboration combines Navy’s expertise, ASCA’s speed to delivery, Defence’s scientific smarts and Anduril Australia’s experience in agile innovation."}],"markDefs":[],"style":"normal"},{"_key":"1531059944a1","_type":"block","children":[{"_key":"b3080840ee040","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"9c5b10d0e752","_type":"block","children":[{"_key":"35991c119c190","_type":"span","marks":[],"text":"“We are a nation girt by sea, and the Ghost Shark is one of the tools we are developing for the Navy to patrol and protect our oceans and our connection to the world.”"}],"markDefs":[],"style":"normal"},{"_key":"197fe98d518d","_type":"block","children":[{"_key":"b822ab4808920","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"f7cec9e6a6a9","_type":"block","children":[{"_key":"a8224887f5760","_type":"span","marks":["strong"],"text":"Quotes attributable to Chief Defence Scientist Prof Tanya Monro AC"}],"markDefs":[],"style":"normal"},{"_key":"95d2f31081c0","_type":"block","children":[{"_key":"eb2e7e224b160","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"43ae3b224cb6","_type":"block","children":[{"_key":"8e5da6297ba00","_type":"span","marks":[],"text":"Delivering the first Ghost Shark prototype ahead of schedule sets a new standard for capability development at the speed of need. Ghost Shark is already well ahead of its three-year development schedule."}],"markDefs":[],"style":"normal"},{"_key":"d27bd6d15763","_type":"block","children":[{"_key":"0063a72ffc6d0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"7cf12eacb3e6","_type":"block","children":[{"_key":"ed7d990415840","_type":"span","marks":[],"text":"The Ghost Shark program is delivering an operationally relevant capability within a fraction of traditional defence timelines. Early creation and testing of the first Ghost Shark has been critical for rapid learning and iteration – this is how we deliver advanced asymmetric capability."}],"markDefs":[],"style":"normal"},{"_key":"fa501148f0c7","_type":"block","children":[{"_key":"b504308070750","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"f832f1653006","_type":"block","children":[{"_key":"6785355f13a80","_type":"span","marks":[],"text":"DSTG is contributing its own pathfinding technologies into the Ghost Shark’s powerful capability, as well as design and development expertise for key systems and payloads."}],"markDefs":[],"style":"normal"},{"_key":"73d0ada4102e","_type":"block","children":[{"_key":"3a9257edf9d90","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"0a6203a2a6d2","_type":"block","children":[{"_key":"55fa217c84d80","_type":"span","marks":["strong"],"text":"Quotes attributable to Head of the Advanced Strategic Capabilities Accelerator (ASCA), Prof Emily Hilder"}],"markDefs":[],"style":"normal"},{"_key":"9a1353a532ef","_type":"block","children":[{"_key":"7808d4318b2f0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"a7c43229f2f1","_type":"block","children":[{"_key":"50aed914ef920","_type":"span","marks":[],"text":"Ghost Shark is a real living exemplar of the approach we are taking within ASCA to deliver advanced asymmetric capabilities that have a two-to-three-year development horizon."}],"markDefs":[],"style":"normal"},{"_key":"c5b287710533","_type":"block","children":[{"_key":"349827e095330","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"51a8a7c1e795","_type":"block","children":[{"_key":"e90bdfb286470","_type":"span","marks":[],"text":"We have created an incredibly integrated team for Ghost Shark with DSTG and ASCA team members working alongside with Navy and Anduril – each of us bringing our unique expertise and experience what is ASCA Mission Zero. The only way we’ll succeed at pace is if we do this together."}],"markDefs":[],"style":"normal"},{"_key":"5bbe4fd20205","_type":"block","children":[{"_key":"45aaa112d82c0","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"first-ghost-shark-debuts-in-australia"},"title":"Ghost Shark Debuts in Australia "},{"_createdAt":"2024-04-08T01:07:30Z","_id":"a062cb7a-1eac-4172-a669-45534b3ebf68","_rev":"ESvEjc6swyeoEqIQr9kEw6","_type":"article","_updatedAt":"2026-04-08T01:28:34Z","authors":[{"_key":"caa03c81954e","_ref":"c1dbab2b-5fb8-472a-bb84-9db80e122a31","_type":"reference"}],"categories":[{"_key":"2732a77fa705","_ref":"76930408-9dd1-4e94-a22a-e3fb91a252c8","_type":"reference"}],"date":"2024-04-08","image":{"_type":"imageWithMeta","alt":"Anduril's command and control dashboard tracking multi-domain unmanned systems operations.","asset":{"_ref":"image-a7a4c73330b112dcfefdd441ad843af155030185-1664x938-png","_type":"reference"}},"meta":{"_type":"meta","description":"At the U.S. Navy's Integrated Battle Problem 24.1 exercise, Anduril used its Lattice software to command and control teams of heterogenous unmanned and autonomous assets operating in the air, on the sea, and below the surface across the Southern California Offshore Range.","title":"Anduril demonstrates multi-domain unmanned systems command and control, undersea, and airborne capabilities at US Navy's IBP 24.1","type":"article"},"metadata":null,"parent":{"_ref":"cb940787-64b7-481d-8379-537ea6a1cf56","_type":"reference"},"slices":[{"_key":"b566f09416e2","_type":"oneColumnRichText","content":[{"_key":"56ecc4841ec3","_type":"block","children":[{"_key":"d3ce8b9c85690","_type":"span","marks":[],"text":"At the U.S. Navy’s Integrated Battle Problem 24.1 exercise, Anduril used its Lattice software to command and control teams of heterogeneous unmanned and autonomous assets operating in the air, on the sea, and below the surface across the Southern California Offshore Range. Anduril served as the prime technology provider for U.S. Pacific Fleet, integrating more than a dozen Anduril and partner platforms and data sources into Lattice — an open AI-enabled software platform that fuses various data sources and assets into an intelligent common operating picture — which served as the primary mission management platform for the exercise."}],"markDefs":[],"style":"lead"},{"_key":"91abe90fee0f","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-a7a4c73330b112dcfefdd441ad843af155030185-1664x938-png","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"65cbf53cbfcb","_type":"block","children":[{"_key":"aa6a5508cd860","_type":"span","marks":[],"text":"Lattice served as the primary software solution to integrate, network, and command and control teams of heterogeneous unmanned vehicles across air, sea, and sub-sea from a single intelligent common operating picture. During IBP 24.1, more than 100 geographically distributed operators leveraged Lattice to successfully achieve multi-domain mission objectives that spanned the dynamic targeting sequence of find, fix, track, target, engage, and assess."}],"markDefs":[],"style":"normal"},{"_key":"b8dfdeac47f7","_type":"block","children":[{"_key":"b669e5d96f250","_type":"span","marks":[],"text":"To achieve mission success, Anduril and partner organizations leveraged Lattice’s open APIs and software development kit to quickly integrate seven uncrewed surface vessel (USV) variants, three unmanned aerial vehicle (UAV) variants, one autonomous underwater vehicle, and multiple commercial data feeds into Lattice. In addition to Lattice integrations, Anduril also deployed Lattice onto multiple partner platforms, which then served as additional nodes to further bolster Lattice’s secure data mesh network and ensure resilient communications beyond-line-of-sight (BLOS) during the exercise."}],"markDefs":[],"style":"normal"},{"_key":"8ea8f420618b","_type":"block","children":[{"_key":"8b22a0e14de80","_type":"span","marks":[],"text":"Throughout IBP 24.1, operators not only leveraged Lattice as a common operational picture, but also used Lattice to construct and execute coordinated multi-domain, multi-asset mission plans. Operators used Lattice to automate machine tasking of UxVs, adjusting their position, speed, and sensor coverage in real-time based on observations of changing battlefield conditions, demonstrating the operational utility of Lattice’s low-latency data mesh. Over the course of the event, operators tasked Dive-LD to navigate a series of undersea waypoints from a surface loiter, tasked multiple partner USVs to conduct high-speed navigation, executed multiple successful Altius launches from partner USVs, cued multi-domain assets based on shared targeting data, and coordinated multiple Anduril and partner systems to perform a standardized set of autonomous behaviors."}],"markDefs":[],"style":"normal"},{"_key":"8812eedd1934","_type":"block","children":[{"_key":"f4df90d015d90","_type":"span","marks":[],"text":"The success of IBP 24.1 demonstrates how Lattice enables multi-domain command and control of mass effects at strategic, tactical, and operational levels."}],"markDefs":[],"style":"normal"},{"_key":"bca0249ce588","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-5dcc4b6b416290e94eaf5687b34c06737f2fede1-1800x894-png","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"fdfd8265ff75","_type":"block","children":[{"_key":"3b17fac402dd0","_type":"span","marks":[],"text":"Tasked and controlled through Lattice, Dive-LD successfully demonstrated a 120-hour end-to-end mission where Dive-LD autonomously navigated hundreds of nautical miles across demanding bathymetry, relying upon onboard vehicle compute and planning software for navigation."}],"markDefs":[],"style":"normal"},{"_key":"f4909df8f2e2","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_ref":"image-ebcafb038c5e9df8b216ca695dee4a44dd6bfaed-1479x779-png","_type":"reference"}},"imageWidth":"100","style":"center"},{"_key":"9a04867efe52","_type":"block","children":[{"_key":"2501da8def120","_type":"span","marks":[],"text":"With multiple launches and hours of operational flight time, Anduril successfully demonstrated the flexibility, multi-domain launch, and expeditionary capabilities of the Altius family of systems at IBP 24.1."}],"markDefs":[],"style":"normal"},{"_key":"208b8b388e4e","_type":"block","children":[{"_key":"7ddd97584bec0","_type":"span","marks":[],"text":"Anduril executed multiple beyond-line-of-sight (BLOS) Altius launches from partner USVs, extending Altius’s best-in-class range by providing highly-mobile, unmanned launch points in the maritime domain. Lattice enabled operators to verify pre-launch conditions for Altius through FMV sensor data from partner USVs, initiate the launch itself, and validate conditions post-launch. Once in the air, Altius leveraged advanced autonomy and in-flight command and control tasking via Lattice to execute simultaneous, coordinated ISR missions on moving targets in conjunction with partner assets across domains."}],"markDefs":[],"style":"normal"},{"_key":"c9b0b2e761ea","_type":"block","children":[{"_key":"c196260dcc020","_type":"span","marks":[],"text":"All of the Altius systems that participated in IBP 24.1 were successfully recovered for future re-use."}],"markDefs":[],"style":"normal"},{"_key":"79ba21b1b346","_type":"block","children":[{"_key":"cc7a405500100","_type":"span","marks":[],"text":"About IBP 24.1"}],"markDefs":[],"style":"h2"},{"_key":"5e796c778413","_type":"block","children":[{"_key":"298fb6914960","_type":"span","marks":[],"text":"Led by U.S. Pacific Fleet (PACFLT) and orchestrated by U.S. 3rd Fleet, IBP 24.1 took place off the coast of Southern California and provided the U.S. Navy with the ability to analyze, simulate, prototype, and demonstrate multi-domain unmanned systems to implement into future fleet operations. IBP 24.1 was the fourth iteration under the PACFLT Experimentation Plan, which is focused on testing and developing unmanned capabilities “above the sea, on the sea and below the sea” that contribute to a stronger naval force, further driving capabilities to significantly reduce the risk to personnel in hostile environments."}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"ibp-24-1-command-and-control"},"title":"Anduril demonstrates multi-domain unmanned systems command and control, undersea, and airborne capabilities at US Navy’s IBP 24.1"}],"slices":[{"_key":"cbc881069ed9","_type":"oneColumnRichText","content":[{"_key":"8ada6259be6e","_type":"block","children":[{"_key":"1a8a0e8e94780","_type":"span","marks":["em","strong"],"text":"The Rhode Island production facility will enable Anduril to increase production to 200 AUVs per year and create more than 100 jobs over the next five years. The factory announcement comes amid growing demand for Anduril’s AUVs, including an $18.6 million contract with the U.S. Navy."}],"markDefs":[],"style":"lead"},{"_key":"b7724655d30a","_type":"block","children":[{"_key":"7f5312b7df820","_type":"span","marks":[],"text":"Anduril Industries is announcing a new manufacturing facility to support large-scale production of its Dive-LD family of autonomous underwater vehicles (AUVs) at Quonset Point, Rhode Island. By investing in a scaled production facility ahead of need, Anduril will be able to stay ahead of customer demand and deliver on orders with unprecedented speed."}],"markDefs":[],"style":"normal"},{"_key":"3775971522b5","_type":"block","children":[{"_key":"fa67cfe24bd70","_type":"span","marks":[],"text":"AUVs are transforming maritime deterrence by providing an affordable, distributed, and adaptable undersea capability that complements the U.S. and allied submarine fleet. Developing, manufacturing, and fielding these systems at scale on an operationally-relevant timeline will be critical. The 100,000-150,000 square foot production facility will enable Anduril to immediately increase production capacity for its Dive-LD family of AUVs to more than 200 hulls per year. Anduril plans to create more than 100 jobs within five years of the facility opening in 2025."}],"markDefs":[],"style":"normal"},{"_key":"7a432eea18c8","_type":"block","children":[{"_key":"07c95d093be20","_type":"span","marks":[],"text":"\"We are thrilled to build a state-of-the-art production manufacturing facility for our LD family of vehicles in Quonset Point. Affordable, distributed mass is a central tenet of undersea deterrence and we look forward to supporting large-scale, cost-effective AUV deployments with our new facility,\" said Shane Arnott, Senior Vice President at Anduril Industries. \"Our Maritime Division continues to develop advanced undersea capabilities and, with large contract awards both in the United States and Australia, we are committed to the mass manufacturing of those proven capabilities at speed and at scales that matter.\""}],"markDefs":[],"style":"normal"},{"_key":"a4f5b79da1bf","_type":"block","children":[{"_key":"52ee3869e5f80","_type":"span","marks":[],"text":"Anduril AUVs are designed from the ground-up for production at scale, with a heavy emphasis on commercial-off-the-shelf components with robust supply chains, a modular design, and advanced, scalable manufacturing techniques that enable rapid iterations based on customer needs. The facility is strategically located in close proximity to Anduril’s maritime engineering center in Quincy, Massachusetts, ensuring that products can be rapidly updated based on customer feedback, even in the midst of full-rate production. The production facility will be able to accommodate the complete lifecycle of the hull — from R&D through sustainment — with dedicated onsite testing facilities, service bays, and more. This manufacturing facility will enable Anduril to produce AUVs at scale and create a paradigm shift in maritime deterrence that places a greater emphasis on unmanned and autonomous systems."}],"markDefs":[],"style":"normal"},{"_key":"aefac558f174","_type":"block","children":[{"_key":"3a96105e3b280","_type":"span","marks":[],"text":"The factory announcement comes amid growing demand from defense and commercial customers. The U.S. Navy, for example, recently awarded Anduril an $18.6 million contract to cover an initial buy of Dive AUVs through the Defense Innovation Unit’s (DIU) Large Displacement Unmanned Underwater Vehicles (LDUUV) prototyping effort, following a “"},{"_key":"b7c850c5827a","_type":"span","marks":["b82c0bb85973"],"text":"swim-off"},{"_key":"d7fec3e95144","_type":"span","marks":[],"text":"” competition late last year."}],"markDefs":[{"_key":"b82c0bb85973","_type":"internalLink","reference":{"_id":"a22d60cc-2ee0-4840-949d-b42cbd36090a","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"diu-awards-anduril-contract-to-innovate-new-capabilities-for-undersea-warfare"},"title":"DIU awards Anduril contract to innovate new capabilities for undersea warfare"},"targetBlank":false}],"style":"normal"},{"_key":"2d140f22a020","_type":"block","children":[{"_key":"04e1b1e029b70","_type":"span","marks":[],"text":"“Over the last 6 months, the U.S. Navy, in partnership with DIU and Congress, has driven an aggressive program timeline to put vendors on contract, acquire capabilities, and rapidly demonstrate those capabilities with warfighters,” said Nick Stoner, Director at Anduril Industries. “This contract is a fantastic example of how the U.S. Navy can incentivize industry to make capital investments and produce the kinds of undersea asymmetric advantages our Fleet Commanders need, on the timelines they need them.”"}],"markDefs":[],"style":"normal"},{"_key":"6861c021be99","_type":"block","children":[{"_key":"451bd848b44d0","_type":"span","marks":[],"text":"Driven by Anduril’s investment in long-range, autonomous undersea capabilities, the Dive family of AUVs has emerged as the leading solution for a variety of missions, including operational preparation of the environment, surveillance and reconnaissance, mine warfare, subsea and seabed warfare, seafloor mapping, and more. Now, with a larger manufacturing facility under construction, Anduril will be able to rapidly scale production and accelerate delivery to customers."}],"markDefs":[],"style":"normal"},{"_key":"bbf04ad4f7a1","_type":"block","children":[{"_key":"1c119bdeaf5f0","_type":"span","marks":[],"text":"This announcement comes as Anduril continues to advance critical, distributed maritime missions around the world through large and extra large autonomous subsurface capabilities. Earlier this year, Anduril unveiled the first prototype Ghost Shark extra-large autonomous undersea vehicle, "},{"_key":"d9060b5ea5f4","_type":"span","marks":["145f856bbcea"],"text":"developed and delivered ahead of schedule and on-budget"},{"_key":"aa38bca79369","_type":"span","marks":[],"text":" at its Sydney, Australia location in partnership with the Royal Australian Navy, the Advanced Strategic Capabilities Accelerator, and the Defence Science and Technology Group (DSTG)."}],"markDefs":[{"_key":"145f856bbcea","_type":"internalLink","reference":{"_id":"c60ac9b8-73ce-4dfa-8047-1a3aa39d6389","_type":"article","language":null,"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"}},"slug":{"_type":"slug","current":"first-ghost-shark-debuts-in-australia"},"title":"Ghost Shark Debuts in Australia "},"targetBlank":false}],"style":"normal"},{"_key":"472005415b9a","_type":"block","children":[{"_key":"3125e7c965460","_type":"span","marks":[],"text":"Anduril is a defense technology company on a mission to transform U.S. and allied militaries with advanced technology. Anduril is committed to delivering innovative maritime capabilities that will transform deterrence in an increasingly complex global security environment for the U.S. and its allies."}],"markDefs":[],"style":"normal"},{"_key":"a7c38f9a6756","_type":"block","children":[{"_key":"3771cfb129130","_type":"span","marks":["strong"],"text":"Quote attributable to Rhode Island Governor Dan McKee"}],"markDefs":[],"style":"normal"},{"_key":"4081690ac189","_type":"block","children":[{"_key":"2bd083ab2ceb0","_type":"span","marks":[],"text":"“Anduril joins an esteemed list of the nation’s leading defense contractors with operations in Rhode Island, like General Dynamics Electric Boat, Raytheon, and Textron, among others,” said Governor Dan McKee. “Their addition further demonstrates Quonset as a hub of good-paying, quality jobs for Rhode Islanders that will help our state in raising incomes for all.”"}],"markDefs":[],"style":"normal"},{"_key":"0775b4d1acdd","_type":"block","children":[{"_key":"bccfa853e5f40","_type":"span","marks":["strong"],"text":"Quote attributable to Rhode Island Secretary of Commerce Liz Tanner"}],"markDefs":[],"style":"normal"},{"_key":"86903a730f7b","_type":"block","children":[{"_key":"dd903009e2530","_type":"span","marks":[],"text":"\"We welcome Anduril to the Ocean State,\" said Secretary of Commerce Liz Tanner. \"Their presence will not only create high-paying jobs but also drive innovation in ocean technology, helping to establish Rhode Island's position as a leader in the blue economy.\""}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-to-open-large-scale-production-facility-for-autonomous-underwater-vehicles"},"title":"Anduril to Open Large Scale Production Facility for Autonomous Underwater Vehicles"}],"slices":[{"_key":"00e1567659c5","_type":"oneColumnRichText","content":[{"_key":"bac41282ce5f","_type":"block","children":[{"_key":"f2878fba19f4","_type":"span","marks":[],"text":"Anduril, a leader in autonomous systems and weapons manufacturing, today announced it has selected Columbus, Ohio as the location of Arsenal-1, its first hyperscale manufacturing facility. Arsenal-1 will redefine the scale and speed that autonomous systems and weapons can be produced for the United States and its allies and partners. This is a monumental and essential step toward rebuilding America’s defense industrial base, strengthening America’s warfighting capabilities, and enhancing deterrence amid rising international threats."}],"markDefs":[],"style":"lead"},{"_key":"ef13c2555b2c","_type":"block","children":[{"_key":"4211cd6f8d12","_type":"span","marks":[],"text":"Ohio is the ideal location for Anduril’s first Arsenal factory with its robust infrastructure to support Anduril’s unique needs, a highly skilled and diverse manufacturing workforce, and a legacy of leadership in aerospace and defense. Anduril is investing nearly $1 billion of its own dollars into the development of Arsenal-1 and will bring more than 4,000 direct jobs in the largest single job-creation project in the state’s history."}],"markDefs":[],"style":"normal"},{"_key":"b53309566673","_type":"block","children":[{"_key":"ab7607f67df6","_type":"span","marks":[],"text":"“Arsenal-1 represents a step forward in how we manufacture the autonomous systems and weapons that our nation and our allies need to remain secure” said Anduril CEO Brian Schimpf. “By harnessing a world-class workforce and a scalable, software-driven approach to manufacturing, Arsenal-1 will set the standard for how we respond to the challenges of the future fight. Ohio’s infrastructure and talent pool make it the ideal home for this historic effort to rebuild the arsenal of democracy.”"}],"markDefs":[],"style":"normal"},{"_key":"1203e89fa362","_type":"block","children":[{"_key":"33c9ca3efd0a","_type":"span","marks":[],"text":"“Ohio’s history of advancing aviation, aerospace, and national defense runs deep, but what sets this state apart is our readiness to embrace the future,” said Governor DeWine. “At this critical moment in time, our country needs rapid technological innovation, which Anduril will deliver using Ohio’s skilled, hardworking labor force. The future of American air power will be made in Ohio!”"}],"markDefs":[],"style":"normal"},{"_key":"bd1f7d1e4e58","_type":"block","children":[{"_key":"89298655b6c5","_type":"span","marks":[],"text":"\"Today is a proud day for Ohio as we welcome Anduril and celebrate the creation of thousands of new jobs in cutting-edge defense manufacturing,” said Lt. Governor Jon Husted. “This investment reinforces Ohio's position as a leader in advanced technology and national security. When it comes to 'Made in America,' you can’t do it without 'Made in Ohio.”"}],"markDefs":[],"style":"normal"},{"_key":"a5b957ce5e13","_type":"block","children":[{"_key":"4a6587774e1e","_type":"span","marks":["strong"],"text":"Arsenal-1: A New Standard for Defense Manufacturing"}],"markDefs":[],"style":"normal"},{"_key":"3c8d7b39041d","_type":"block","children":[{"_key":"3cd152752104","_type":"span","marks":[],"text":"As the United States and our allies attempt to gain affordable mass with autonomous systems and weapons, the defense industrial base must be capable of producing orders of magnitude more than it is currently producing today. To support that effort, Anduril is hyperscaling weapons manufacturing with Arsenal — a software-defined manufacturing platform that is optimized for the mass production of autonomous systems and weapons."}],"markDefs":[],"style":"normal"},{"_key":"0d4f8e8f0cfb","_type":"block","children":[{"_key":"fd4a4f91d4b6","_type":"span","marks":[],"text":"Arsenal-1 will be the first of its kind: a manufacturing facility that utilizes a common set of commercial manufacturing tooling, machinery, and processes for every type of autonomous vehicle that Anduril produces. Arsenal-1 provides maximum flexibility to reallocate the most critical manufacturing resources — people, capital, machines, and materials — to meet new requirements, launch new products, or scale production to meet surges in demand, indefinitely. The foundation of Arsenal-1 is Arsenal OS, an integrated digital software platform that integrates the design, development, and mass production stages for all Anduril products."}],"markDefs":[],"style":"normal"},{"_key":"4eb491edc27d","_type":"block","children":[{"_key":"6522ed05c9a5","_type":"span","marks":["strong"],"text":"Anduril & Ohio: Collaborating to Strengthen National Security"}],"markDefs":[],"style":"normal"},{"_key":"94fede177513","_type":"block","children":[{"_key":"800e557fb2b1","_type":"span","marks":[],"text":"Located next to Rickenbacker Airport, the site provides direct access to two 12,000-foot runways and a 75-acre private apron capable of supporting military-scale aircraft, ensuring rapid delivery of components and systems to our customers. At full scale, the facility will span 5 million square feet and produce tens of thousands of military systems annually. Looking ahead, with more than 500 acres available for future expansion, Arsenal-1 is primed for long-term scalability and will manufacture and produce most of Anduril’s autonomous weapons, sensors and systems at full rate production."}],"markDefs":[],"style":"normal"},{"_key":"f71d4ffa733c","_type":"block","children":[{"_key":"b5200a1e052a","_type":"span","marks":[],"text":"Ohio’s robust workforce, which includes the third largest skilled manufacturing labor pool in the country, further solidifies the state’s appeal. Arsenal-1 is expected to create 4,000 direct high-quality jobs and drive economic growth in Pickaway County and surrounding areas, establishing Ohio as a hub for defense manufacturing. An additional 8,500 jobs from suppliers, construction, and other sectors are expected to support the growth and sustainment of Arsenal-1."}],"markDefs":[],"style":"normal"},{"_key":"0715db6fae34","_type":"block","children":[{"_key":"6c926098c3cc","_type":"span","marks":[],"text":"“Anduril and Palmer Luckey are world class innovators, we couldn’t be more excited to have them in Ohio, and our state is open for business,” said Senator Moreno. “Ohio has consistently led the way in manufacturing, and I’m thrilled that Anduril selected Columbus as home to Arsenal-1. This one-of-a-kind facility is a transformative investment and will allow our state to be a leader in developing technology, creating jobs, and strengthening our national security.”"}],"markDefs":[],"style":"normal"},{"_key":"f9e29972f570","_type":"block","children":[{"_key":"5a5fd3430ce3","_type":"span","marks":[],"text":"“The future is here in Ohio. Anduril’s investment will transform an empty hangar into a state-of-the-art manufacturing facility and provide "},{"_key":"93046e417ea1","_type":"span","marks":["em"],"text":"thousands"},{"_key":"c9f9c38da27a","_type":"span","marks":[],"text":" of good paying jobs to Ohioans,” said Rep. Mike Carey of Ohio’s 15th Congressional District. “We thank Governor Mike DeWine for his leadership, which has fostered innovation in our state, and welcome Anduril to Ohio’s 15th District.”"}],"markDefs":[],"style":"normal"},{"_key":"28b9c70df228","_type":"block","children":[{"_key":"ee65ab997943","_type":"span","marks":[],"text":"“Ohio is elated to welcome Anduril to our state as a cutting-edge manufacturer of autonomous systems and weapons,” said Rep. Dave Taylor of Ohio’s 2nd Congressional District. “Dating back to when the Wright Brothers first took flight, Ohio has proven itself to be a leader in aerospace, innovation, and defense. This legacy continues as Anduril builds its Arsenal-1 hyperscale manufacturing facility in Columbus and plays a central role in ensuring our United States military is equipped to remain the world’s strongest warfighting machine. By choosing to build its facility here, Anduril can take advantage of our region’s highly skilled workforce and provide thousands of well-paying jobs to Ohioans. Their mission of hyperscaling weapons manufacturing is not only historic but critical to the safety and security of our Nation, and we are proud to welcome them to our region.”"}],"markDefs":[],"style":"normal"},{"_key":"54ecdf158963","_type":"block","children":[{"_key":"d1260db6d0d4","_type":"span","marks":[],"text":"“Anduril’s announcement to create thousands of new jobs throughout Columbus, Ohio, to strengthen our economy, and further establish Ohio's capital as a global hub for aerospace and innovation, is encouraging” said Rep. Joyce Beatty of Ohio's 3rd Congressional District."}],"markDefs":[],"style":"normal"},{"_key":"60f141b78142","_type":"block","children":[{"_key":"c7356d0f8b9c","_type":"span","marks":[],"text":"Ohio has a deep-rooted legacy in aerospace and defense innovation and a community aligned with our mission to strengthen national security. Home to Wright-Patterson Air Force Base, a critical hub for U.S. Air Force operations and research, the state has long been at the forefront of advancing military capabilities. The Air Force Research Laboratory, also located in Ohio, drives technological breakthroughs in defense, while NASA’s Glenn Research Center and the Neil A. Armstrong Test Facility play pivotal roles in aeronautics and space exploration. Additionally, the National Air and Space Intelligence Center and the National Space Intelligence Center further establish Ohio as a center of excellence for both the air and space domains and defense intelligence."}],"markDefs":[],"style":"normal"},{"_key":"c35250324a1f","_type":"block","children":[{"_key":"022b8bab42a6","_type":"span","marks":[],"text":"The decision to build Arsenal-1 in Ohio follows an extensive, year-long search process that evaluated numerous locations across the United States and is contingent upon standard due diligence, state and local approvals of incentives, permitting and other legal and regulatory matters. Pending approvals, construction on the facility will begin immediately and the first products will be manufactured beginning in July 2026."}],"markDefs":[],"style":"normal"},{"_key":"2ba5afd1318a","_type":"block","children":[{"_key":"41053d1fe9a6","_type":"span","marks":[],"text":"Anduril’s commitment to agile, responsive manufacturing has already been demonstrated globally. Arsenal-1 in Ohio will join Anduril’s other factories including our solid rocket motor factory in Mississippi, our robotic submarine facility in Rhode Island, our launched effects factory in Georgia, our XL-AUV factory in Australia and production facilities in California."}],"markDefs":[],"style":"normal"}],"fullBleed":true}],"slug":{"_type":"slug","current":"anduril-building-arsenal-1-hyperscale-manufacturing-facility-in-ohio"},"title":"Anduril Building Arsenal-1 Hyperscale Manufacturing Facility in Ohio","path":"news/anduril-building-arsenal-1-hyperscale-manufacturing-facility-in-ohio"}
    </script>
